<script>
// Applied synchronously, before the stylesheet paints anything, so a stored dark/light override
// takes effect on first frame instead of flashing the wrong theme for a moment. Absent a stored
// override, no attribute is set here -- the CSS's own prefers-color-scheme media query handles
// following the system setting with no JS involved at all.
(function() {
  try {
    var t = localStorage.getItem('deckbuilder_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

<style>
  :root {
    --border: #E0DED5;
    --border-strong: #B4B2A9;
    --text-primary: #1a1a1a;
    --text-secondary: #5F5E5A;
    --text-muted: #918F86;
    --sku-gray: #C7C5BB;
    --surface-1: #F7F6F2;
    --surface-2: #fff;
    --page-bg: #fff;
    --backdrop: #E8E6DE;
    --accent: #EC2027;
    --accent-2: #F26169;
    --radius: 8px;
    color-scheme: light;
  }
  /* Dark mode: follows the OS/browser preference by default (unset data-theme), overridable either
     way via the toggle button, which stamps data-theme and persists it to localStorage. The
     :not([data-theme="light"]) guard is what lets an explicit light override win even when the
     system itself prefers dark -- without it, the media query would always beat a plain :root rule. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --border: #3A362F;
      --border-strong: #4F4A41;
      --text-primary: #F3F1EC;
      --text-secondary: #B7B3A9;
      --text-muted: #8A8579;
      --sku-gray: #57534A;
      --surface-1: #211F1B;
      --surface-2: #2A2823;
      --page-bg: #17150F;
      /* --backdrop deliberately NOT overridden here -- it's dual-purpose (also the rep's explicit
         canvas-background choice, set as an inline style by setBackdrop()), so it needs to stay
         theme-independent or the visibly-selected swatch and the actually-rendered backdrop would
         disagree the moment dark mode is active but no swatch has been clicked yet. */
      --accent: #EC2027;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --border: #3A362F;
    --border-strong: #4F4A41;
    --text-primary: #F3F1EC;
    --text-secondary: #B7B3A9;
    --text-muted: #8A8579;
    --sku-gray: #57534A;
    --surface-1: #211F1B;
    --surface-2: #2A2823;
    --page-bg: #17150F;
    --accent: #EC2027;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0; padding: 0; color: var(--text-primary); background: var(--page-bg);
  }
  .wrap { max-width: none; margin: 0; padding: 0; }
  .wrap.deck-mode { display: block; max-width: none; margin: 0 auto; padding: 32px 24px 80px; }
  .wrap > .no-print { display: flex; align-items: flex-start; }

  .sidebar {
    width: 340px; flex: 0 0 340px; height: 100vh; position: sticky; top: 0; overflow-y: auto;
    background: var(--surface-1); border-right: 0.5px solid var(--border); padding: 18px 18px 18px;
  }
  .sidebar .panel { background: none; border: none; padding: 0; margin-bottom: 0; }
  /* Sidebar-scoped compaction so the whole tool list fits without its own scrollbar --
     everything here overrides shared classes (field-row, field label, inputs, radio-group,
     button.secondary) that the top-bar layout also uses at full size, so this only shrinks
     things inside .sidebar, never the main results column. */
  .sidebar .header-row { margin-bottom: 12px; }
  .sidebar .brandmark .mark { width: 30px; height: 30px; border-radius: 9px; }
  .sidebar .brandmark .mark svg { width: 16px; height: 16px; }
  /* !important needed here: a dark-mode media-query rule targeting .pwrLogoDark elsewhere in this
     file (:root:not([data-theme="light"]) .brandStack .pwrLogoDark) out-specifies a plain
     .sidebar .brandStack .pwrLogoDark selector, so a same-weight override silently loses in dark
     mode -- matched to the "DeckBuilder" wordmark's own rendered width (~79px) per request, height
     auto so the logo's real aspect ratio still holds instead of being stretched/squashed. */
  .sidebar .brandStack .pwrLogo, .sidebar .brandStack .pwrLogoDark { width: 79px !important; height: auto !important; }
  .sidebar .brandmark .wordmark { font-size: 14px; }
  .sidebar .field-row { gap: 12px; margin-bottom: 8px; }
  .sidebar .field label { font-size: 10.5px; margin-bottom: 3px; }
  .sidebar input[type=text], .sidebar input[type=number], .sidebar select {
    height: 28px; font-size: 12px;
  }
  .sidebar .radio-group { height: 24px; gap: 10px; }
  .sidebar .radio-group label { font-size: 12px; }
  .sidebar button.secondary { height: 27px; font-size: 12px; padding: 0 10px; }
  .sidebar button.tiny-remove { width: 22px; height: 22px; }
  .sidebar #advancedOptions { margin-bottom: 0; }
  .sidebar .bg-swatch, .sidebar #customBgColor { width: 20px !important; height: 20px !important; }
  .main { flex: 1 1 auto; min-width: 0; padding: 24px 28px 24px; }

  @media (max-width: 900px) {
    .wrap > .no-print { flex-direction: column; }
    .sidebar { width: 100%; flex: none; height: auto; position: static; border-right: none; border-bottom: 0.5px solid var(--border); }
    .main { padding: 20px; }
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 28px; }

  .panel { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .field-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .field { flex: 1; min-width: 160px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
  input[type=text], input[type=number], select {
    width: 100%; height: 36px; padding: 0 10px; border: 0.5px solid var(--border);
    border-radius: var(--radius); font-size: 14px; background: var(--surface-2); color: var(--text-primary);
  }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .price-field-wrap {
    position: relative; flex: 0 0 auto; height: 36px;
    border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-2);
  }
  /* Pinned to a fixed pixel top (measured against the real rendered input, not computed from
     50%/transform) -- percentage + translateY math kept resolving against subtly different
     containing-block heights depending on context, which is exactly the kind of drift that made
     the $ hard to nail down. A frozen px value has nothing left to resolve differently. Both the
     $ and the input also share one explicit "font" shorthand (family, size, and line-height all
     together) so there's no chance of the two silently drifting onto different font metrics. */
  .price-field-wrap .dollar-prefix {
    position: absolute; left: 10px; top: 8.5px;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--text-muted); pointer-events: none;
  }
  .price-field-wrap input[type=number] {
    width: calc(5ch + 29px); height: 100%; border: none; padding: 0 10px 0 19px; background: transparent;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .price-field-wrap input[type=number]:focus { outline: none; }
  .suggestions-panel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    display: flex; flex-direction: column; max-height: 220px; overflow-y: auto;
    border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px;
    background: var(--surface-2); box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .suggestion-item { padding: 7px 10px; font-size: 13px; border-radius: 6px; cursor: pointer; }
  .suggestion-item:hover, .suggestion-item.active { background: var(--surface-1); }
  .cat-dropdown-panel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;
    border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px;
    background: var(--surface-2); box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .cat-dropdown-panel label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; margin: 0; }
  .cat-dropdown-panel .cat-group-heading {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); margin: 6px 0 0;
  }
  .cat-dropdown-panel .cat-group-heading:first-child { margin-top: 0; }
  .cat-dropdown-panel label.cat-sub-label { padding-left: 14px; }
  .radio-group { display: flex; gap: 14px; align-items: center; height: 36px; }
  .radio-group label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-primary); font-weight: 400; margin: 0; }
  button.primary {
    height: 40px; padding: 0 20px; border: none; border-radius: var(--radius);
    background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button.primary:hover { opacity: 0.9; }
  button.secondary {
    height: 40px; padding: 0 16px; border: 0.5px solid var(--border-strong); border-radius: var(--radius);
    background: var(--surface-2); color: var(--text-primary); font-size: 14px; cursor: pointer;
  }
  button.tiny-remove {
    flex: 0 0 auto; width: 26px; height: 26px; border: 0.5px solid var(--border-strong); border-radius: 6px;
    background: var(--surface-2); color: var(--text-secondary); font-size: 12px; cursor: pointer; line-height: 1;
  }
  button.tiny-remove:hover { background: var(--surface-1); color: var(--accent); }

  #resultsHeader { display: none; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #resultsHeader p { font-size: 13px; color: var(--text-secondary); margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
  .card { border: 0.5px solid var(--border); border-radius: 10px; padding: 12px; position: relative; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; cursor: pointer; z-index: 2; }
  .imgwrap { position: relative; aspect-ratio: 1; background: var(--backdrop); border-radius: 8px; overflow: hidden; }
  /* "Transparent" backdrop sets --backdrop to the literal string "transparent" (see setBackdrop),
     which makes .imgwrap show whatever's behind it rather than any visible cue that this is the
     transparent option -- add an actual checkerboard so it reads the same way any image editor
     signals transparency, instead of just looking blank. */
  body.transparent-backdrop .imgwrap { background-image: repeating-conic-gradient(#bbb 0% 25%, #eee 0% 50%); background-size: 16px 16px; }
  .imgwrap img.base { width: 100%; height: 100%; object-fit: contain; }
  span.sku { font-size: 12px; font-weight: 400; color: var(--sku-gray); }
  p.name { font-size: 13px; font-weight: 700; text-align: left; line-height: 1.35; overflow: hidden; margin: 10px 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  p.name .name-eyebrow { color: var(--text-muted); }
  p.name .name-main { font-size: 15px; }
  p.desc { font-size: 9px; color: var(--text-secondary); line-height: 1.4; margin: 0 0 8px; height: 52px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .price-table { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: 0.5px solid var(--border); padding-top: 8px; }
  .price-table td { padding-top: 8px; }
  .price-table p.qty { font-size: 9px; color: var(--text-muted); margin: 0; }
  .price-table p.pr { font-size: 12px; font-weight: 500; margin: 0; }
  .fees { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--border); }
  .fees p { font-size: 10px; color: var(--text-secondary); margin: 0 0 4px; line-height: 1.4; }
  .addon-row { display: flex; flex-wrap: wrap; column-gap: 32px; row-gap: 4px; }
  .addon-row span { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }

  #emptyState { display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  #deckBar { display: none; position: sticky; bottom: 0; z-index: 10; background: var(--page-bg); border-top: 0.5px solid var(--border); padding: 14px 28px; margin: 20px -28px 0; justify-content: space-between; align-items: center; }
  #deckBar p { font-size: 13px; color: var(--text-secondary); margin: 0; }

  /* A client-facing deck export must always render in fixed light/print colors, never the app's
     current dark-mode UI theme -- the page itself is hardcoded white below, but descendants were
     still reading the theme-following --text-* vars, so dark mode produced near-invisible light
     text on that white page. Redeclaring the vars here shadows the :root dark-mode overrides for
     everything inside #deckView without touching a single individual rule. */
  #deckView {
    display: none;
    --text-primary: #1a1a1a; --text-secondary: #5F5E5A; --text-muted: #918F86;
    --sku-gray: #C7C5BB; --border: #E0DED5;
  }
  .deck-page { width: 14in; min-height: 8.5in; margin: 0 auto 40px; padding: 0.5in 0.6in; background: white; border: 0.5px solid var(--border); color: var(--text-primary); }
  .deck-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--text-primary); padding-bottom: 10px; margin-bottom: 20px; }
  .deck-header h2 { font-size: 16px; margin: 0; }
  .deck-header p { font-size: 11px; color: var(--text-secondary); margin: 0; }
  .deck-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 24px; }
  /* Image is aspect-ratio:1 so it'd otherwise grow as tall as the column and push the text block
     below past the 8.5in page height -- cap it so the whole card always fits regardless of how
     many columns/how wide each one is (height is the binding constraint either way). */
  .deck-grid .imgwrap { max-width: 3.75in; margin: 0 auto; }

  @page { size: legal landscape; margin: 0; }
  @media print {
    .no-print { display: none !important; }
    .wrap { padding: 0; }
    .deck-page { border: none; margin: 0; width: 14in; min-height: 8.5in; }
    .deck-page:not(:last-child) { page-break-after: always; break-after: always; }
    body { margin: 0; padding: 0; }
    .imgwrap { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  .note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .brandmark { display: flex; align-items: center; gap: 10px; }
  .brandmark .mark {
    width: 50px; height: 50px; border-radius: 15px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 8px rgba(236, 32, 39, 0.35);
  }
  .brandStack { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .brandStack .pwrLogo { height: 26px; width: auto; display: block; }
  /* A flat raster logo can't recolor itself via CSS vars the way the SVG glyph text does -- swap
     in a pre-recolored (black text -> white, red mark left alone) PNG variant instead, toggled by
     the same dark-mode conditions used everywhere else (system preference + explicit override). */
  .brandStack .pwrLogoDark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brandStack .pwrLogo { display: none; }
    :root:not([data-theme="light"]) .brandStack .pwrLogoDark { height: 26px; width: auto; display: block; }
  }
  :root[data-theme="dark"] .brandStack .pwrLogo { display: none; }
  :root[data-theme="dark"] .brandStack .pwrLogoDark { height: 26px; width: auto; display: block; }
  .brandmark .wordmark { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1; }
  .brandmark .wordmark span { font-weight: 800; color: var(--accent); }

  .settingsIconLink {
    position: relative; width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    cursor: pointer; transition: opacity 0.15s;
  }
  .settingsIconLink:hover { opacity: 0.7; }
  .settingsTooltip {
    /* Deliberately a fixed dark chip, not var(--text-primary) -- that token flips to a light color
       in dark mode, which would invert this into unreadable light-text-on-light-background. */
    position: absolute; top: calc(100% + 8px); right: 0; width: 200px; background: #1a1a1a;
    color: #fff; font-size: 11px; line-height: 1.5; padding: 8px 10px; border-radius: 6px;
    opacity: 0; visibility: hidden; transition: opacity 0.15s; pointer-events: none; text-align: left; z-index: 30;
  }
  .settingsTooltip::after { content: ''; position: absolute; bottom: 100%; right: 12px; border: 5px solid transparent; border-bottom-color: #1a1a1a; }
  .settingsIconLink:hover .settingsTooltip, .settingsIconLink:focus .settingsTooltip { opacity: 1; visibility: visible; }

  /* Widened from icon-only 22x18 buttons to icon+text pills -- reps couldn't tell the icon-only
     buttons apart without hovering, which never happens on a touchscreen. flex-wrap on the row
     lets the pills drop to a second line on narrow cards instead of clipping. */
  .region-ctrl-btn {
    border: 1px solid var(--border); border-radius: 3px; height: 20px; padding: 0 6px;
    display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; cursor: pointer;
    background: var(--surface-2); color: var(--text-secondary); font-size: 9.5px; flex-shrink: 0;
  }
  .region-ctrl-swatch-wrap {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 3px;
    height: 20px; padding: 0 6px; background: var(--surface-2); color: var(--text-secondary); font-size: 9.5px; flex-shrink: 0;
    cursor: pointer;
  }
  .colorize-region-input { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; padding: 0; border: 1px solid var(--border); border-radius: 2px; cursor: pointer; flex-shrink: 0; }
  .colorize-region-input::-webkit-color-swatch-wrapper { padding: 0; }
  .colorize-region-input::-webkit-color-swatch { border: none; border-radius: 2px; }
  .colorize-region-input::-moz-color-swatch { border: none; border-radius: 2px; }

  /* .grid was a fixed 3 columns with no responsive fallback at all -- fine on desktop, but on a
     phone-width viewport it squeezed each card down to ~110px, which is what was crushing the
     per-region control row's 4 buttons down to ~14px tall, well under any usable touch-target
     size, long before the buttons' own sizing was the actual problem. Fewer columns on narrower
     viewports gives cards (and everything inside them) real room instead. */
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .region-ctrl-btn, .region-ctrl-swatch-wrap { height: 30px; padding: 0 10px; font-size: 11px; }
    .colorize-region-input { width: 20px; height: 20px; }
    .region-ctrl-row { gap: 8px !important; font-size: 11px !important; }
  }
</style>
</head>

    <div class="panel">
      <div class="field-row">
        <div class="field" style="position:relative; flex:1.6; min-width:200px;">
          <label>Category</label>
          <button type="button" id="catDropdownBtn" class="secondary" style="width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center;">
            <span id="catDropdownLabel">All Categories</span>
            <span aria-hidden="true">&#9662;</span>
          </button>
          <div id="fCategory" class="cat-dropdown-panel" style="display:none;"></div>
        </div>
        <div class="field" style="flex:0 0 auto;">
          <label>Price Range Per Unit</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <div class="price-field-wrap">
              <span class="dollar-prefix" id="minDollar">$</span>
              <input type="number" id="fBudgetMin" placeholder="Min" value="0" />
            </div>
            <span style="color:var(--text-muted);">–</span>
            <div class="price-field-wrap">
              <span class="dollar-prefix" id="maxDollar">$</span>
              <input type="number" id="fBudgetMax" placeholder="Max" />
            </div>
          </div>
        </div>
        <div class="field" style="flex:1; min-width:200px; position:relative;">
          <label>Search (Name, Tags, Keywords, SKU)</label>
          <div style="display:flex; gap:12px;">
            <input type="text" id="fSearch" placeholder="e.g. eco-friendly, tech, 4231" autocomplete="off" style="flex:1; min-width:0;" />
            <button type="button" class="secondary" id="resetBtn" title="Clear all filters, the uploaded logo, and pattern to start fresh" style="flex:0 0 auto; padding:0 14px;">Start Over</button>
          </div>
          <div id="searchSuggestions" class="suggestions-panel" style="display:none;"></div>
        </div>
      </div>
      <div id="advancedOptions" style="margin-bottom:14px; border:0.5px solid var(--border); border-radius:var(--radius); padding:0;">
        <div style="padding:8px 10px; font-size:13px; font-weight:500; color:var(--text-primary); border-bottom:0.5px solid var(--border);">Pricing, Currency &amp; Branding Options</div>
        <div style="padding:0 10px 10px;">
      <div class="field-row">
        <div class="field" style="max-width:220px; display:flex; gap:10px;">
          <div style="flex:1; min-width:0;">
            <label>Add Pricing</label>
            <div class="radio-group">
              <label><input type="radio" name="pricing" value="yes" checked> Yes</label>
              <label><input type="radio" name="pricing" value="no"> No</label>
            </div>
          </div>
          <div id="currencyField" style="flex:1; min-width:0;">
            <label>Currency</label>
            <div class="radio-group">
              <label><input type="radio" name="currency" value="US" checked> US</label>
              <label><input type="radio" name="currency" value="CAD"> CAD</label>
            </div>
          </div>
        </div>
        <div style="flex-basis:100%; width:100%; border-top:0.5px solid var(--border); margin:4px 0;"></div>
        <div class="field" id="logoField" style="max-width:220px;">
          <label>Upload Logo</label>
          <input type="file" id="logoInput" accept="image/*,.pdf,.ai,application/pdf,application/postscript,application/illustrator" style="display:none;" />
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <button type="button" id="logoChooseBtn" title="Upload a new logo" style="width:26px;height:26px;border-radius:6px;border:1px dashed var(--border-strong);background:transparent;color:var(--text-secondary);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;">+</button>
            <div id="logoHistoryRow" style="display:contents;"></div>
          </div>
          <div style="display:none;">
            <span id="logoFileName">No File Chosen</span>
            <button type="button" id="removeLogoBtn" title="Remove Logo">✕</button>
          </div>
          <a href="#" id="clearLogoHistoryLink" style="display:inline-block; font-size:10px; color:var(--text-muted); margin-top:3px; text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Clear Logo History</a>
          <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
            <label class="chk" style="display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-secondary); font-weight:400; flex:1; min-width:0;">
              <input type="checkbox" id="colorizeAllChk" /> Colorize Logo
            </label>
            <input type="color" id="colorizeAllColor" value="#1a1a1a" disabled style="width:22px; height:22px; padding:0; border:0.5px solid var(--border); border-radius:6px; cursor:pointer; opacity:0.4; flex-shrink:0;" title="Colorize color" />
          </div>
        </div>
        <div style="flex-basis:100%; width:100%; border-top:0.5px solid var(--border); margin:4px 0;"></div>
        <div class="field" id="patternField" style="max-width:340px;">
          <label>Pattern</label>
          <input type="file" id="customPatternInput" accept="image/*" style="display:none;" />
          <div id="patternSwatches" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
            <button type="button" id="patternChooseBtn" title="Upload a custom pattern" style="width:26px;height:26px;border-radius:6px;border:1px dashed var(--border-strong);background:transparent;color:var(--text-secondary);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;">+</button>

          <label class="chk" style="display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-secondary); font-weight:400; margin-top:5px;">

          <div style="display:flex; align-items:center; gap:8px; margin-top:3px;">

              <input type="checkbox" id="strokeChk" /> Stroke

            <button type="button" class="bg-swatch" data-color="#F7F7F5" style="width:26px;height:26px;border-radius:6px;background:#F7F7F5;border:2px solid transparent;cursor:pointer;padding:0;" title="Soft White"></button>

// deck/exports without touching the underlying region data. Keyed by SKU, then by a stable region
// key ('primary', or 'extra0'/'extra1'/... matching regions.extra's own array order).
let regionOverrides = {};

}
// Enumerates every controllable region on a product -- the one primary (whichever of
// rect/poly/mask is actually set) plus each extra, in the same order the rotate/hide buttons are
// drawn in, so the UI and the override-application logic below always agree on what "extra0"
// etc. refers to.
function regionOverrideKeyList(regions) {
  if (!regions) return [];
  const list = [];
  const primaryKind = regions.rect ? 'rect' : (regions.poly ? 'poly' : (regions.mask ? 'mask' : null));
  if (primaryKind) list.push({ key: 'primary', label: 'Main', kind: primaryKind });
  (regions.extra || []).forEach((ex, i) => {
    list.push({ key: 'extra' + i, label: ex.label || ('Area ' + (i + 2)), kind: ex.kind });
  });
  return list;
}
// Returns a NEW regions object with this session's overrides baked in -- never mutates the
// original PRODUCTS data. A hidden region is simply omitted (drawBrandedCard already skips any
// falsy rect/poly/mask and any extra not present in the array); a rotated region gets
// __extraRotateSteps attached, read by paintRegionContent above to spin the logo the requested
// number of additional 90° steps on top of whatever the region's own data already specifies; a
// pattern-hidden region gets __skipPattern attached, read by paintRegionContent to skip just the
// pattern-fill block for that one region while its logo still renders normally (and to fall back
// off the card-wide knockout for that region too, since there's no pattern left to knock out
// against); a colorized region gets __colorize attached with the chosen hex, read by
// paintRegionContent to override the logo source with a solid-color knockout in that color.
function applyRegionOverrides(regions, sku) {
  if (!regions) return regions;
  const skuOverrides = regionOverrides[sku];
  if (!skuOverrides) return regions;
  const out = { rect: regions.rect, poly: regions.poly, mask: regions.mask, extra: (regions.extra || []).slice() };
  function applyOne(region, ov) {
    if (!ov) return region;
    if (ov.hidden) return null;
    let next = region;
    if (ov.rotateSteps) next = Object.assign({}, next, { __extraRotateSteps: ov.rotateSteps });
    if (ov.hidePattern) next = Object.assign({}, next, { __skipPattern: true });
    if (ov.colorize) next = Object.assign({}, next, { __colorize: ov.colorize });
    if (ov.logoScale && ov.logoScale !== 1) next = Object.assign({}, next, { __logoScale: ov.logoScale });
    return next;
  }
  const primaryKind = out.rect ? 'rect' : (out.poly ? 'poly' : (out.mask ? 'mask' : null));
  if (primaryKind) out[primaryKind] = applyOne(out[primaryKind], skuOverrides['primary']);
  out.extra = out.extra
    .map((ex, i) => applyOne(ex, skuOverrides['extra' + i]))
    .filter(Boolean);

}

    const files = await res.json();
    if (!Array.isArray(files)) throw new Error('Unexpected response shape');
    const imageExt = /\.(jpe?g|png|webp|gif)$/i;

      background:#fff center/contain no-repeat url('${entry.url}');"></button>

      background:#fff center/contain no-repeat url('${entry.dataUrl}');"></button>
  `).join('');
  row.innerHTML = pinnedThumbs + historyThumbs;
  row.querySelectorAll('.pinnedLogoBtn').forEach(btn => btn.addEventListener('click', () => {
    const entry = LOGO_LIBRARY.find(l => l.url === btn.dataset.url);
    if (!entry) return;
    logoDataUrl = entry.url;
    document.getElementById('logoInput').value = '';
    document.getElementById('logoFileName').textContent = entry.name;
    renderGrid(applySort(currentResults));
  }));
  row.querySelectorAll('.logoHistoryBtn').forEach(btn => btn.addEventListener('click', () => {

// Dragging a range slider fires 'input' continuously (dozens of events across a couple seconds),
// and renderGrid tears down + repaints every visible product's canvas from scratch each time --
// undebounced, a single drag queued up dozens of full-grid repaints competing with each other.
// Debouncing to just the last event after motion pauses collapses that to one real repaint.
function debounce(fn, ms) {
  let timer = null;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

  try {
    const res = await fetch(`https://api.github.com/repos/${PATTERN_REPO}/contents/patterns?ref=${PATTERN_BRANCH}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const files = await res.json();
    if (!Array.isArray(files)) throw new Error('Unexpected response shape');
    const imageExt = /\.(jpe?g|png|webp|gif)$/i;
    const urls = files
      .filter(f => f.type === 'file' && imageExt.test(f.name) && !PATTERN_LIBRARY_EXCLUDE.includes(f.name))
      .map(f => `https://cdn.jsdelivr.net/gh/${PATTERN_REPO}@${PATTERN_BRANCH}/patterns/${f.name}`);
    if (!urls.length) throw new Error('No pattern image files found in patterns/ folder');
    PATTERN_LIBRARY = urls;
    renderPatternSwatches();
    console.log('Loaded ' + urls.length + ' patterns from GitHub.');
  } catch (err) {

function populateCategoryDropdown() {
  const checkedBefore = new Set(getSelectedCategories());
  catBox.innerHTML = '';
  // Categories are "Group | Subcategory" strings -- group them under a heading instead of
  // showing ~15+ pipe-delimited lines flat, since that's what they actually are underneath.
  const catSet = [...new Set(PRODUCTS.map(p => p.category))];
  const groups = new Map();
  catSet.forEach(c => {
    const parts = c.split('|').map(s => s.trim());
    const group = parts.length > 1 ? parts[0] : '';
    const sub = parts.length > 1 ? parts.slice(1).join(' | ') : parts[0];
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push({ full: c, sub });
  });
  [...groups.keys()].sort().forEach(group => {
    if (group) {
      const heading = document.createElement('div');
      heading.className = 'cat-group-heading';
      heading.textContent = group;
      catBox.appendChild(heading);
    }
    groups.get(group).sort((a, b) => a.sub.localeCompare(b.sub)).forEach(({ full, sub }) => {
      const id = 'cat-' + full.replace(/[^a-z0-9]+/gi, '-');
      const label = document.createElement('label');
      if (group) label.className = 'cat-sub-label';
      label.innerHTML = `<input type="checkbox" id="${id}" value="${full}" ${checkedBefore.has(full) ? 'checked' : ''}> ${sub}`;
      catBox.appendChild(label);
    });
  });
  updateCatDropdownLabel();
}

// Arrow-key navigation through the visible suggestions -- Down/Up move a highlighted "active"
// item (wrapping at each end), Enter picks the active one if there is one (falls back to
// submitting the typed text as-is otherwise), Escape closes the panel without picking anything.
function activeSuggestionIndex() {
  const items = [...suggestionsPanel.querySelectorAll('.suggestion-item')];
  return items.findIndex(el => el.classList.contains('active'));
}
function setActiveSuggestion(index) {
  const items = [...suggestionsPanel.querySelectorAll('.suggestion-item')];
  items.forEach(el => el.classList.remove('active'));
  if (!items.length) return;
  const wrapped = ((index % items.length) + items.length) % items.length;
  items[wrapped].classList.add('active');
  items[wrapped].scrollIntoView({ block: 'nearest' });
}

  const isOpen = suggestionsPanel.style.display !== 'none';
  if (e.key === 'ArrowDown' && isOpen) {
    e.preventDefault();
    setActiveSuggestion(activeSuggestionIndex() + 1);
  } else if (e.key === 'ArrowUp' && isOpen) {
    e.preventDefault();
    setActiveSuggestion(activeSuggestionIndex() - 1);
  } else if (e.key === 'Enter') {
    const active = suggestionsPanel.querySelector('.suggestion-item.active');
    if (isOpen && active) searchInput.value = active.dataset.tag;
    suggestionsPanel.style.display = 'none';
    applyFilters();
  } else if (e.key === 'Escape') {
    suggestionsPanel.style.display = 'none';
  }
});

// Renders page 1 of a PDF (or a PDF-compatible .ai file -- Illustrator embeds a real PDF layer by
// default unless that option was turned off at save time, so this same path handles both) to a
// PNG data URL via pdf.js. The canvas is never pre-filled with a background color, so any area the
// PDF itself doesn't paint stays transparent -- a page with a genuinely transparent background
// comes out transparent already; one with a painted white/solid background still gets flattened
// onto it here same as any other file, but trimImageWhitespace (below) then strips that the same
// way it already does for a flattened PNG/JPG upload.
async function renderPdfPageToDataUrl(arrayBuffer) {
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const targetLongEdge = 1400;
  const baseViewport = page.getViewport({ scale: 1 });
  const scale = targetLongEdge / Math.max(baseViewport.width, baseViewport.height);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas.toDataURL('image/png');
}

// Uploaded logo files often carry blank padding around the actual mark (a common export habit
// for print-ready logos). Contain-fit sizes against the whole file's bounding box, so that
// padding directly shrinks the visible logo — cropping it away here means every placement sizes
// against the real ink, not empty margin. Background = fully transparent pixels, or pixels
// close to the color sampled from the four corners (covers both transparent-PNG logos and ones
// flattened onto a solid background).
function trimImageWhitespace(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    // Needed to read pixels back off a remote (library) image, but ONLY for actual remote URLs —
    // setting crossOrigin on a local relative path (this app's own bundled pattern files, when
    // opened directly as a file:// page) makes Chrome treat it as a cross-origin request under its
    // strict "every file: URL is its own origin" policy and reject the load outright ("Unsafe
    // attempt to load URL ... 'file:' URLs are treated as unique security origins"). Local/relative
    // paths and data: URLs are already same-origin (or origin-less), so they don't need or want it.
    if (/^https?:\/\//i.test(dataUrl)) img.crossOrigin = 'anonymous';
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      let data;
      try { data = ctx.getImageData(0, 0, w, h).data; } catch (err) { resolve(dataUrl); return; }

      const corners = [0, (w - 1) * 4, (h - 1) * w * 4, ((h - 1) * w + (w - 1)) * 4];
      let bgR = 0, bgG = 0, bgB = 0;
      corners.forEach((i) => { bgR += data[i]; bgG += data[i + 1]; bgB += data[i + 2]; });
      bgR /= corners.length; bgG /= corners.length; bgB /= corners.length;
      const tolerance = 18;
      const isBackground = (i) => {
        if (data[i + 3] < 10) return true;
        return Math.abs(data[i] - bgR) <= tolerance && Math.abs(data[i + 1] - bgG) <= tolerance && Math.abs(data[i + 2] - bgB) <= tolerance;
      };

      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!isBackground((y * w + x) * 4)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX < minX || maxY < minY) { resolve(dataUrl); return; } // blank file — keep as-is
      const pad = Math.round(Math.max(w, h) * 0.02);
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
      const cropW = maxX - minX + 1, cropH = maxY - minY + 1;
      if (cropW >= w * 0.98 && cropH >= h * 0.98) { resolve(dataUrl); return; } // negligible padding — skip re-encode

      const out = document.createElement('canvas');
      out.width = cropW; out.height = cropH;
      out.getContext('2d').drawImage(c, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
      resolve(out.toDataURL('image/png'));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

    btn.style.border = btn.dataset.color.toLowerCase() === hex.toLowerCase() ? '2px solid var(--accent)' : '2px solid transparent';
  });
  // "transparent" isn't a value <input type=color> accepts -- leave its own last-picked hex alone
  // rather than have the browser silently reject the assignment.
  if (hex !== 'transparent') document.getElementById('customBgColor').value = hex;
  // Branded cards bake the backdrop color into their canvas at paint time (paintBrandedCanvases
  // reads --backdrop then), unlike plain product cards which reference the CSS var live via
  // .imgwrap's background -- so branded ones go stale without an explicit re-render here.
  renderGrid(applySort(currentResults));
}

document.querySelectorAll('.bg-swatch').forEach(btn => {
  btn.addEventListener('click', () => setBackdrop(btn.dataset.color));
});
document.getElementById('customBgColor').addEventListener('input', (e) => setBackdrop(e.target.value));

function currency() { return document.querySelector('input[name=currency]:checked').value; }
function pricingOn() { return document.querySelector('input[name=pricing]:checked').value === 'yes'; }

function fmtPrice(n) {
  const cur = currency();
  const sym = cur === 'CAD' ? 'CA$' : '$';
  return sym + parseFloat(n).toFixed(2);
}

// Runs live as filters change (category checkbox, budget field, search text, currency/pricing
// toggle) -- there's no separate "Search Products" button anymore, so this is the one place all of
// those triggers converge. Budget-search analytics are only logged from here when a rep actually
// typed a budget value (via logBudgetSearchIfSet below), not on every incidental keystroke elsewhere.
function applyFilters() {
  const cats = getSelectedCategories();
  let lo = minField().value !== '' ? parseFloat(minField().value) : null;
  let hi = maxField().value !== '' ? parseFloat(maxField().value) : null;
  if (lo !== null && hi !== null && lo > hi) { const t = lo; lo = hi; hi = t; }
  const search = document.getElementById('fSearch').value.toLowerCase().trim();

  currentResults = PRODUCTS.filter(p => {
    if (cats.length && !cats.includes(p.category)) return false;
    // Min defaults to 0 (see fBudgetMin's value="0") so every product's real price already clears
    // it -- treat that default as "no minimum set" here too, or a product with zero price tiers
    // would silently vanish from the default view just because $0 counts as an active filter.
    if ((lo !== null && lo > 0) || hi !== null) {
      if (!p.tiers.length) return false;
      const price = basePrice(p);
      if (lo !== null && price < lo) return false;
      if (hi !== null && price > hi) return false;
    }
    if (search) {
      const hay = (p.sku + ' ' + p.tags.join(' ') + ' ' + p.name + ' ' + p.description + ' ' + p.category).toLowerCase();
      const words = search.split(/\s+/).filter(Boolean);
      const matches = words.some(w => hay.includes(w));
      if (!matches) return false;
    }
    return true;
  });

  hasSearched = true;
  document.getElementById('resultsHeader').style.display = 'flex';
  document.getElementById('resultsCount').textContent = currentResults.length + ' Product' + (currentResults.length===1?'':'s') + ' Found';
  renderGrid(applySort(currentResults));
  return { lo, hi };
}

// Budget-search analytics used to only fire from the Search button's own click handler -- kept as
// a separate opt-in call (not baked into every applyFilters() call) so switching category or
// typing in the search box doesn't spam an analytics event every time, only genuine budget entry.
const logBudgetSearchIfSet = debounce(() => {
  const lo = minField().value !== '' ? parseFloat(minField().value) : null;
  const hi = maxField().value !== '' ? parseFloat(maxField().value) : null;
  if ((lo !== null && lo > 0) || hi !== null) {
    logAnalyticsEvents([{ eventType: 'budgetSearched', value: currency(), extra: JSON.stringify({ min: lo, max: hi }) }]);
  }
}, 600);

const debouncedApplyFilters = debounce(applyFilters, 250);

document.getElementById('selectAllBtn').addEventListener('click', () => {
  const allSelected = currentResults.length > 0 && currentResults.every(p => selected.has(p.sku));
  if (allSelected) {
    currentResults.forEach(p => selected.delete(p.sku));
  } else {
    currentResults.forEach(p => selected.add(p.sku));

});

document.getElementById('resetBtn').addEventListener('click', () => {
