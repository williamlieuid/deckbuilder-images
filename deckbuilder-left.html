  snapshot.width = canvas.width; snapshot.height = canvas.height;
  snapshot.getContext('2d').drawImage(canvas, 0, 0);
  brandedRenderCache.set(p.sku, { recipeKey, canvas: snapshot });
}

// Most stuck/failed loads are transient (a momentary CDN blip), so retry silently a couple times
// before ever bothering the user -- only a genuinely persistent failure gets a visible retry icon.
const AUTO_RETRY_COUNT = 2;
const AUTO_RETRY_DELAY_MS = 3000;
async function paintOneBrandedCanvasWithRetry(canvas, logoImg, backdrop, generation) {
  hideRetryBadge(canvas);
  for (let attempt = 0; attempt <= AUTO_RETRY_COUNT; attempt++) {
    if (generation !== renderGeneration) return; // superseded -- no point retrying work nobody will see
    try {
      await paintOneBrandedCanvas(canvas, logoImg, backdrop, generation);
      return;
    } catch (err) {
      console.warn('Could not paint branded canvas for', canvas.dataset.sku, '(attempt', attempt + 1, 'of', AUTO_RETRY_COUNT + 1, ')', err);
      if (attempt < AUTO_RETRY_COUNT) await new Promise(r => setTimeout(r, AUTO_RETRY_DELAY_MS));
    }
  }
  if (generation === renderGeneration) showRetryBadge(canvas, logoImg, backdrop);
}

function hideRetryBadge(canvas) {
  const wrap = canvas.closest('.imgwrap');
  const badge = wrap && wrap.querySelector('.retryBadge');
  if (badge) badge.remove();
}
function showRetryBadge(canvas, logoImg, backdrop) {
  const wrap = canvas.closest('.imgwrap');
  if (!wrap || wrap.querySelector('.retryBadge')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'retryBadge no-print';
  btn.title = 'Image failed to load — click to retry';
  btn.textContent = '↻';
  btn.style.cssText = 'position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:none; background:rgba(236,32,39,0.92); color:#fff; font-size:15px; cursor:pointer; z-index:2;';
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    btn.disabled = true; btn.style.opacity = '0.5';
    await paintOneBrandedCanvasWithRetry(canvas, logoImg, backdrop);
  });
  wrap.appendChild(btn);
}

function showRenderProgress(total) {
  const el = document.getElementById('renderProgress');
  if (!el) return;
  el.style.display = 'flex';
  updateRenderProgress(0, total);
}
function updateRenderProgress(done, total) {
  const label = document.getElementById('renderProgressLabel');
  const fill = document.getElementById('renderProgressFill');
  if (label) label.textContent = 'Rendering images… ' + done + '/' + total;
  if (fill) fill.style.width = (total ? (done / total * 100) : 0) + '%';
}
function hideRenderProgress() {
  const el = document.getElementById('renderProgress');
  if (el) el.style.display = 'none';
}

async function paintBrandedCanvases(container) {
  const canvases = [...container.querySelectorAll('canvas.branded-canvas')];
  if (!canvases.length) return;
  // Claimed synchronously, before any await, so a second paintBrandedCanvases call started while
  // this one is still in flight always correctly supersedes it (see renderGeneration's own comment
  // above paintOneBrandedCanvas for why this matters -- overlapping renders are routine, not rare).
  const myGeneration = ++renderGeneration;
  let logoImg = null;
  try { if (logoDataUrl) logoImg = await withTimeout(loadImageCached(logoDataUrl), IMAGE_LOAD_TIMEOUT_MS); } catch (err) { return; }
  if (myGeneration !== renderGeneration) return; // superseded while the logo was loading
  const backdrop = getComputedStyle(document.documentElement).getPropertyValue('--backdrop').trim() || '#E8E6DE';
  let done = 0;
  showRenderProgress(canvases.length);
  // Mobile gets a tight concurrency cap — each 700px canvas takes ~2MB of pixel RAM and the
  // Voronoi masking path creates several more per card. Blasting all cards in parallel on a phone
  // exhausts Chrome's memory budget and crashes the tab. Desktop keeps higher parallelism so
  // rendering still feels fast there.
  const CONCURRENCY = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 2 : 6;
  for (let i = 0; i < canvases.length; i += CONCURRENCY) {
    if (myGeneration !== renderGeneration) break;
    await Promise.allSettled(canvases.slice(i, i + CONCURRENCY).map(canvas =>
      paintOneBrandedCanvasWithRetry(canvas, logoImg, backdrop, myGeneration).finally(() => {
        done++;
        if (myGeneration === renderGeneration) updateRenderProgress(done, canvases.length);
      })
    ));
  }
  if (myGeneration === renderGeneration) hideRenderProgress();
}

// ============ card rendering ============

// includeControls is false for the built-deck view (post "Build Deck") -- that view is the
// polished, client-facing output, so the rep-only Download/rotate/colorize/hide-pattern/hide
// controls that belong in the working results grid are omitted there.
function imageBlock(p, includeControls = true) {
  const hasLogo = !!logoDataUrl;
  const hasPattern = p.patternEligible && patternIsSelected();
  const hasRegionBranding = (hasLogo || hasPattern) && !!(p.regions && (p.regions.rect || p.regions.poly || p.regions.mask));

  const baseImg = hasRegionBranding ? p.blankImage : p.masterImage;
  if (!baseImg) {
    return `<div class="imgwrap" style="display:flex; align-items:center; justify-content:center;">
      <span style="font-size:11px; color:var(--text-muted); text-align:center; padding:12px;">Image pending upload</span>
    </div>`;
  }

  if (hasRegionBranding) {
    const isTransparent = getComputedStyle(document.documentElement).getPropertyValue('--backdrop').trim() === 'transparent';
    const isMaterialLocked = !!(p.blackProduct || p.woodProduct || p.clearProduct);
    const isFullColor = !!materialFullColorOverride[p.sku];
    const materialLabel = p.blackProduct ? 'leather etching' : (p.woodProduct ? 'wood engraving' : 'etching');
    const isPatternScaleAdjustable = includeControls && p.patternEligible && !!selectedPattern && !isMaterialLocked;
    return `<div class="imgwrap">
      <canvas class="branded-canvas" data-sku="${p.sku}" data-base="${baseImg}" style="width:100%; height:100%; display:block;"></canvas>
    </div>
    ${isMaterialLocked ? `<button type="button" class="secondary laser-toggle-btn no-print" data-sku="${p.sku}" title="${isFullColor ? 'Switch back to the ' + materialLabel + ' look' : 'Preview a full-color logo instead of the ' + materialLabel + ' look'}" style="width:100%; margin-top:4px; font-size:10px; height:20px; padding:0;">${isFullColor ? 'Full Color (click for ' + (p.blackProduct ? 'Etched' : 'Engraved') + ')' : (p.blackProduct ? 'Etched' : 'Engraved') + ' (click for Full Color)'}</button>` : ''}
    ${isPatternScaleAdjustable ? patternScaleControlHtml(p) : ''}
    ${includeControls ? `<button type="button" class="secondary dl-btn no-print" data-sku="${p.sku}" style="width:100%; margin-top:4px; font-size:10px; height:20px; padding:0;">${isTransparent ? 'Download Transparent Image' : 'Download Image'}</button>
    ${regionControlsHtml(p)}` : ''}`;
  }

  return `<div class="imgwrap">
    <img class="base" src="${baseImg}" />
  </div>
  ${includeControls ? `<button type="button" class="secondary dl-btn no-print" data-sku="${p.sku}" style="width:100%; margin-top:4px; font-size:10px; height:20px; padding:0;">Download Image</button>` : ''}`;
}

// Per-card nudge on top of the global Pattern Scale slider (Pricing, Currency & Branding Options
// panel) -- +/- step by the same 5% the slider itself steps by, clamped to the slider's own
// 20-200% range so a card can never drift somewhere the global control couldn't also reach. Reset
// only shows enabled (full opacity) once this card actually has an override to clear.
function patternScaleControlHtml(p) {
  const scale = effectivePatternScale(p.sku);
  const hasOverride = patternScaleOverride[p.sku] !== undefined;
  return `<div class="region-ctrl-row patternScaleCtrl" style="display:flex; align-items:center; gap:4px; margin-top:4px;">
    <span style="font-size:9.5px; font-weight:600; color:var(--text-muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Pattern Size: <span class="patternScaleValue">${scale}%</span></span>
    <button type="button" class="region-ctrl-btn patternScaleMinusBtn" data-sku="${p.sku}" title="Decrease this card's pattern size by 5%" ${scale <= 20 ? 'disabled' : ''}>−</button>
    <button type="button" class="region-ctrl-btn patternScalePlusBtn" data-sku="${p.sku}" title="Increase this card's pattern size by 5%" ${scale >= 200 ? 'disabled' : ''}>+</button>
    <button type="button" class="region-ctrl-btn patternScaleResetBtn" data-sku="${p.sku}" title="Reset to the default pattern size" style="${hasOverride ? '' : 'opacity:0.4; cursor:default;'}">Reset</button>
  </div>`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// One compact row per controllable branding area (primary + each extra) -- a rotate button that
// adds 90° clockwise per click (cycling 0/90/180/270, session-only, see applyRegionOverrides), a
// color swatch that colorizes the logo to any chosen color (knockout + tint, overrides pattern
// knockout), a checkerboard button (the standard "no fill" indicator) that hides just this area's
// pattern while the logo stays, and a hide toggle that drops that one area's logo/pattern for this
// session without touching the underlying region data. Only rendered for products with more than
// a trivial one-region setup
// worth being told apart, but shown even for a single region so the rotate button stays reachable
// on every branded card.
function regionControlsHtml(p) {
  const list = regionOverrideKeyList(p.regions);
  if (!list.length) return '';
  return `<div class="region-controls no-print" style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
    ${list.map(r => {
      const ov = getRegionOverride(p.sku, r.key);
      return `<div class="region-ctrl-row" style="display:flex; flex-direction:column; gap:4px;">
        <span style="font-size:9.5px; font-weight:600; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</span>
        <div style="display:flex; flex-wrap:wrap; gap:4px;">
          <button type="button" class="region-ctrl-btn rotate-region-btn" data-sku="${p.sku}" data-region="${r.key}" title="Rotate 90° clockwise">↻ Rotate</button>
          <label class="region-ctrl-swatch-wrap" title="${ov.colorize ? ('Colorized ' + ov.colorize + ' — click to clear') : 'Colorize logo (click to pick a color)'}">
            <input type="color" class="colorize-region-input" data-sku="${p.sku}" data-region="${r.key}" value="${ov.colorize || '#1a1a1a'}" style="${ov.colorize ? '' : 'opacity:0.35;'}" />Colorize
          </label>
          <button type="button" class="region-ctrl-btn hide-pattern-region-btn" data-sku="${p.sku}" data-region="${r.key}" title="${ov.hidePattern ? 'Show pattern on this area' : 'Hide pattern on this area (logo stays)'}" style="${ov.hidePattern ? 'opacity:0.55;' : ''}">▦ ${ov.hidePattern ? 'Pattern Hidden' : 'Hide Pattern'}</button>
          <button type="button" class="region-ctrl-btn hide-region-btn" data-sku="${p.sku}" data-region="${r.key}" title="${ov.hidden ? 'Show this area' : 'Hide this area entirely'}" style="${ov.hidden ? 'opacity:0.55;' : ''}">${ov.hidden ? '\u{1F6AB} Branding Hidden' : '\u{1F441} Hide Branding'}</button>
        </div>
        ${logoScaleControlHtml(p, r)}
      </div>`;
    }).join('')}
  </div>`;
}

// Per-region logo size nudge on top of the natural contain-fit size -- +/- steps by 5%, clamped
// to 50-150% so the logo stays a recognizable, contained mark rather than either vanishing or
// blowing out past its region (contain-fit's own edge clamping in containFitSubQuad crops rather
// than distorts at the high end, but there's no reason to invite that by allowing it further).
function logoScaleControlHtml(p, r) {
  const ov = getRegionOverride(p.sku, r.key);
  const pct = Math.round((ov.logoScale || 1) * 100);
  const hasOverride = pct !== 100;
  return `<div style="display:flex; align-items:center; gap:4px;">
    <span style="font-size:9.5px; font-weight:600; color:var(--text-muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Logo Size: <span class="logoScaleValue">${pct}%</span></span>
    <button type="button" class="region-ctrl-btn logo-scale-minus-btn" data-sku="${p.sku}" data-region="${r.key}" title="Decrease this area's logo size by 5%" ${pct <= 50 ? 'disabled' : ''}>−</button>
    <button type="button" class="region-ctrl-btn logo-scale-plus-btn" data-sku="${p.sku}" data-region="${r.key}" title="Increase this area's logo size by 5%" ${pct >= 150 ? 'disabled' : ''}>+</button>
    <button type="button" class="region-ctrl-btn logo-scale-reset-btn" data-sku="${p.sku}" data-region="${r.key}" title="Reset to the default logo size" style="${hasOverride ? '' : 'opacity:0.4; cursor:default;'}">Reset</button>
  </div>`;
}

function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
}

function triggerDownload(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Filename-safe, sortable local timestamp -- e.g. "2026-08-07_1432" -- so repeated exports/
// downloads don't silently overwrite each other and stay in a sensible order in Downloads.
function fileTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

function loadCrossOriginImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    // Same file:// vs remote distinction as loadImageCached/trimImageWhitespace -- a local
    // relative path must not get crossOrigin set, or Chrome rejects the load as unsafe.
    if (/^https?:\/\//i.test(url)) img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function exportProductImage(sku) {
  const p = PRODUCTS.find(x => x.sku === sku);
  if (!p) return;
  const hasLogo = !!logoDataUrl;
  const hasPattern = p.patternEligible && patternIsSelected();
  const hasRegionBranding = (hasLogo || hasPattern) && !!(p.regions && (p.regions.rect || p.regions.poly || p.regions.mask));
  const baseUrl = hasRegionBranding ? p.blankImage : p.masterImage;

  if (!hasRegionBranding) {
    try {
      const baseImg = await loadCrossOriginImage(baseUrl);
      const canvas = document.createElement('canvas');
      canvas.width = baseImg.naturalWidth;
      canvas.height = baseImg.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      triggerDownload(dataUrl, p.sku + '-' + slugify(p.name) + '-' + fileTimestamp() + '.jpg');
    } catch (err) {
      alert('This image can\'t be exported directly due to the source site\'s cross-origin security settings. Opening the original image in a new tab instead — right-click (or long-press) it there to save it manually.');
      window.open(baseUrl, '_blank');
    }
    return;
  }

  try {
    const baseImg = await loadCrossOriginImage(baseUrl);
    const logoImg = logoDataUrl ? await loadCrossOriginImage(logoDataUrl) : null;
    let pattern = null;
    if (p.patternEligible && patternIsSelected() && !p.blackProduct && !p.woodProduct && !p.clearProduct) {
      const overlayImg = p.overlayImage ? await loadCrossOriginImage(p.overlayImage) : null;
      if (selectedPattern) {
        const patternImg = await loadCrossOriginImage(selectedPattern);
        pattern = { img: patternImg, scale: effectivePatternScale(p.sku), knockout: patternKnockout, overlayImg: overlayImg, offsetX: patternOffsetX, offsetY: patternOffsetY };
      } else {
        pattern = { solidColor: selectedPatternSolidColor, knockout: patternKnockout, overlayImg: overlayImg };
      }
    }
    const effectiveRegions = applyRegionOverrides(p.regions, p.sku);
    const canvas = document.createElement('canvas');
    const size = Math.max(baseImg.naturalWidth, baseImg.naturalHeight, 1200);
    const maskImageCache = await loadMaskImageCache(effectiveRegions, loadCrossOriginImage);
    const fullColorOverride = !!materialFullColorOverride[p.sku];
    const effectiveLogoMultiply = ((p.blackProduct || p.woodProduct || p.clearProduct) && !fullColorOverride) ? false : logoMultiply;
    // Exports always render onto opaque white regardless of the live preview's backdrop choice --
    // except "Transparent", which needs the export itself to actually carry an alpha channel, so
    // that one case alone follows the live --backdrop value through to both the canvas fill and
    // the output format (JPEG has no alpha at all).
    const liveBackdrop = getComputedStyle(document.documentElement).getPropertyValue('--backdrop').trim();
    const isTransparent = liveBackdrop === 'transparent';
    drawBrandedCard(canvas, baseImg, logoImg, effectiveRegions, isTransparent ? 'transparent' : '#ffffff', size, pattern, maskImageCache, effectiveLogoMultiply, !!p.woodProduct, !!p.clearProduct, !!p.blackProduct, fullColorOverride);
    const dataUrl = isTransparent ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.92);
    const ext = isTransparent ? '.png' : '.jpg';
    triggerDownload(dataUrl, p.sku + '-' + slugify(p.name) + '-' + fileTimestamp() + ext);
  } catch (err) {
    alert('This image can\'t be exported directly due to the source site\'s cross-origin security settings. Opening the original image in a new tab instead — right-click (or long-press) it there to save it manually.');
    window.open(baseUrl, '_blank');
  }
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('dl-btn')) {
    exportProductImage(e.target.dataset.sku);
    return;
  }
  if (e.target.classList.contains('laser-toggle-btn')) {
    const sku = e.target.dataset.sku;
    const p = PRODUCTS.find(x => x.sku === sku);
    toggleMaterialFullColor(sku);
    const isFullColor = !!materialFullColorOverride[sku];
    const materialLabel = p && p.blackProduct ? 'leather etching' : (p && p.woodProduct ? 'wood engraving' : 'etching');
    const naturalLabel = p && p.blackProduct ? 'Etched' : 'Engraved';
    e.target.textContent = isFullColor ? ('Full Color (click for ' + naturalLabel + ')') : (naturalLabel + ' (click for Full Color)');
    e.target.title = isFullColor ? ('Switch back to the ' + materialLabel + ' look') : ('Preview a full-color logo instead of the ' + materialLabel + ' look');
    return;
  }
  if (e.target.classList.contains('patternScaleMinusBtn') || e.target.classList.contains('patternScalePlusBtn') || e.target.classList.contains('patternScaleResetBtn')) {
    const psSku = e.target.dataset.sku;
    if (e.target.classList.contains('patternScaleResetBtn')) {
      delete patternScaleOverride[psSku];
    } else {
      const delta = e.target.classList.contains('patternScaleMinusBtn') ? -5 : 5;
      const next = Math.max(20, Math.min(200, effectivePatternScale(psSku) + delta));
      patternScaleOverride[psSku] = next;
    }
    const newScale = effectivePatternScale(psSku);
    const ctrl = e.target.closest('.patternScaleCtrl');
    ctrl.querySelector('.patternScaleValue').textContent = newScale + '%';
    ctrl.querySelector('.patternScaleMinusBtn').disabled = newScale <= 20;
    ctrl.querySelector('.patternScalePlusBtn').disabled = newScale >= 200;
    const resetBtn = ctrl.querySelector('.patternScaleResetBtn');
    const hasOverride = patternScaleOverride[psSku] !== undefined;
    resetBtn.style.opacity = hasOverride ? '' : '0.4';
    resetBtn.style.cursor = hasOverride ? '' : 'default';
    invalidateAndRepaintSku(psSku);
    return;
  }
  const sku = e.target.dataset.sku, regionKey = e.target.dataset.region;
  if (e.target.classList.contains('rotate-region-btn')) {
    const cur = getRegionOverride(sku, regionKey);
    setRegionOverride(sku, regionKey, { rotateSteps: (cur.rotateSteps + 1) % 4 });
    invalidateAndRepaintSku(sku);
  } else if (e.target.classList.contains('hide-region-btn')) {
    const cur = getRegionOverride(sku, regionKey);
    const nowHidden = !cur.hidden;
    setRegionOverride(sku, regionKey, { hidden: nowHidden });
    e.target.textContent = nowHidden ? '\u{1F6AB} Branding Hidden' : '\u{1F441} Hide Branding';
    e.target.title = nowHidden ? 'Show this area' : 'Hide this area entirely';
    e.target.style.opacity = nowHidden ? '0.55' : '';
    invalidateAndRepaintSku(sku);
  } else if (e.target.classList.contains('hide-pattern-region-btn')) {
    const cur = getRegionOverride(sku, regionKey);
    const nowHidden = !cur.hidePattern;
    setRegionOverride(sku, regionKey, { hidePattern: nowHidden });
    e.target.textContent = '▦ ' + (nowHidden ? 'Pattern Hidden' : 'Hide Pattern');
    e.target.title = nowHidden ? 'Show pattern on this area' : 'Hide pattern on this area (logo stays)';
    e.target.style.opacity = nowHidden ? '0.55' : '';
    invalidateAndRepaintSku(sku);
  } else if (e.target.classList.contains('colorize-region-input')) {
    // A native color <input> always opens its picker on click -- intercept only the "already
    // colorized, click to clear" case here (before the picker opens) and let every other click
    // through untouched so the picker still opens normally to PICK a color, captured below by the
    // 'change' listener instead.
    const cur = getRegionOverride(sku, regionKey);
    if (cur.colorize) {
      e.preventDefault();
      setRegionOverride(sku, regionKey, { colorize: null });
      e.target.parentElement.title = 'Colorize logo (click to pick a color)';
      e.target.style.opacity = '0.35';
      invalidateAndRepaintSku(sku);
    }
  } else if (e.target.classList.contains('logo-scale-minus-btn') || e.target.classList.contains('logo-scale-plus-btn') || e.target.classList.contains('logo-scale-reset-btn')) {
    const cur = getRegionOverride(sku, regionKey);
    let newScale;
    if (e.target.classList.contains('logo-scale-reset-btn')) {
      newScale = 1;
    } else {
      const delta = e.target.classList.contains('logo-scale-minus-btn') ? -0.05 : 0.05;
      newScale = Math.max(0.5, Math.min(1.5, Math.round(((cur.logoScale || 1) + delta) * 100) / 100));
    }
    setRegionOverride(sku, regionKey, { logoScale: newScale });
    const scaleRow = e.target.parentElement;
    const pct = Math.round(newScale * 100);
    scaleRow.querySelector('.logoScaleValue').textContent = pct + '%';
    scaleRow.querySelector('.logo-scale-minus-btn').disabled = pct <= 50;
    scaleRow.querySelector('.logo-scale-plus-btn').disabled = pct >= 150;
    const resetBtn = scaleRow.querySelector('.logo-scale-reset-btn');
    const hasOverride = pct !== 100;
    resetBtn.style.opacity = hasOverride ? '' : '0.4';
    resetBtn.style.cursor = hasOverride ? '' : 'default';
    invalidateAndRepaintSku(sku);
  }
});

document.addEventListener('change', (e) => {
  if (!e.target.classList.contains('colorize-region-input')) return;
  const sku = e.target.dataset.sku, regionKey = e.target.dataset.region;
  const color = e.target.value;
  setRegionOverride(sku, regionKey, { colorize: color });
  e.target.parentElement.title = 'Colorized ' + color + ' — click to clear';
  e.target.style.opacity = '';
  invalidateAndRepaintSku(sku);
});

function basePrice(p) {
  if (!p.tiers.length) return Infinity;
  const t = p.tiers[0];
  return parseFloat(currency() === 'CAD' ? t.priceCAD : t.priceUS);
}

function applySort(list) {
  const mode = document.getElementById('sortSelect').value;
  const copy = [...list];
  if (mode === 'price-asc') copy.sort((a,b) => basePrice(a) - basePrice(b));
  if (mode === 'price-desc') copy.sort((a,b) => basePrice(b) - basePrice(a));
  return copy;
}

document.getElementById('sortSelect').addEventListener('change', () => {
  renderGrid(applySort(currentResults));
});

function renderGrid(list) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map(p => `
    <div class="card ${selected.has(p.sku) ? 'selected' : ''}" data-sku="${p.sku}">
      <input type="checkbox" class="check" data-sku="${p.sku}" ${selected.has(p.sku) ? 'checked' : ''} />
      ${imageBlock(p)}
      <p class="name"><span class="sku">#${p.sku}</span> ${formatName(p.name)}</p>
      <p class="desc">${truncateWords(p.description, 50)}</p>
      ${priceBox(p)}
    </div>
  `).join('');

  grid.querySelectorAll('.check').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const sku = e.target.dataset.sku;
      if (e.target.checked) selected.add(sku); else selected.delete(sku);
      e.target.closest('.card').classList.toggle('selected', e.target.checked);
      updateDeckBar();
    });
  });
  updateDeckBar();
  paintBrandedCanvases(grid);
}

function updateDeckBar() {
  const bar = document.getElementById('deckBar');
  if (selected.size > 0) {
    bar.style.display = 'flex';
    document.getElementById('deckCount').textContent = selected.size + ' Product' + (selected.size===1?'':'s') + ' Selected';
  } else {
    bar.style.display = 'none';
  }
  const selectAllBtn = document.getElementById('selectAllBtn');
  const allSelected = currentResults.length > 0 && currentResults.every(p => selected.has(p.sku));
  selectAllBtn.textContent = allSelected ? 'Deselect All' : 'Select All';
}

// Builds the deck pages -- shared by all three deck-bar actions (View Deck, Export as Images,
// Export as PDF) so there's one code path regardless of which one a rep clicks first; the
// export-specific buttons just chain their own action on right after this. `navigate` controls
// whether it also switches the screen into deck view: View Deck and Export as PDF need the deck
// actually visible (PDF prints whatever's on screen via window.print()), but a JPG download reads
// pixel data straight out of the (already-painted) canvases regardless of what's on screen, so
// Export as Images passes navigate=false to build/paint everything invisibly and leave the rep
// looking at the results grid the whole time -- no page switch for a plain download.
async function buildDeckPages(navigate = true) {
  const chosen = applySort(PRODUCTS.filter(p => selected.has(p.sku)));
  lastBuiltDeck = chosen;
  deckName = document.getElementById('deckNameInput').value.trim();
  if (navigate) {
    document.querySelectorAll('.wrap > .no-print').forEach(el => el.style.display = 'none');
    document.getElementById('deckBar').style.display = 'none';
    document.getElementById('deckView').style.display = 'block';
    document.getElementById('wrap').classList.add('deck-mode');
  }

  const pageContainer = document.getElementById('pagesContainer');
  const dateStr = new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});

  // chunk into groups of 3 (Legal landscape), one .deck-page per group
  const chunks = [];
  for (let i = 0; i < chosen.length; i += 3) chunks.push(chosen.slice(i, i + 3));

  pageContainer.innerHTML = chunks.map(chunk => `
    <div class="deck-page">
      <div class="deck-header">
        <h2>${deckName ? deckName.replace(/</g, '&lt;') : 'Product Recommendations'}</h2>
        <p>${dateStr}</p>
      </div>
      <div class="deck-grid">
        ${chunk.map(p => `
          <div>
            ${imageBlock(p, false)}
            <p class="name"><span class="sku">#${p.sku}</span> ${formatName(p.name)}</p>
            <p class="desc">${truncateWords(p.description, 50)}</p>
            ${priceBox(p)}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
  await paintBrandedCanvases(pageContainer);

  // Analytics: one event per fact this build represents, batched into a single beacon. "Second
  // location" = the first extra region beyond a product's primary one (regionOverrideKeyList's
  // index 1, key "extra0") -- only counted if it's actually enabled, not hidden via override.
  const analyticsEvents = [];
  chosen.forEach(p => {
    analyticsEvents.push({ eventType: 'decked', value: p.sku });
    const patternApplied = p.patternEligible && patternIsSelected() && !p.blackProduct && !p.woodProduct && !p.clearProduct;
    if (patternApplied) analyticsEvents.push({ eventType: 'patterned', value: p.sku });
    const regionList = regionOverrideKeyList(p.regions);
    if (regionList.length >= 2 && !getRegionOverride(p.sku, regionList[1].key).hidden) {
      analyticsEvents.push({ eventType: 'secondLocationUsed', value: p.sku });
    }
  });
  if (logoDataUrl) {
    analyticsEvents.push({ eventType: 'logoUsed', value: document.getElementById('logoFileName').textContent || 'unknown' });
  }
  logAnalyticsEvents(analyticsEvents);
}

document.getElementById('viewDeckBtn').addEventListener('click', () => buildDeckPages());
document.getElementById('exportImagesBarBtn').addEventListener('click', async () => { await buildDeckPages(false); downloadDeckAsJpg(); });
document.getElementById('exportPdfBarBtn').addEventListener('click', async () => { await buildDeckPages(); window.print(); });

document.getElementById('backToEditBtn').addEventListener('click', () => {
  document.querySelectorAll('.wrap > .no-print').forEach(el => el.style.display = '');
  document.getElementById('deckView').style.display = 'none';
  document.getElementById('wrap').classList.remove('deck-mode');
  updateDeckBar();
});

document.getElementById('downloadBtn').addEventListener('click', () => window.print());

// Canvas can't be captured via SVG foreignObject/XMLSerializer, so each deck page is
// manually re-composited onto a fresh canvas (images via drawImage, text via fillText
// with manual word-wrap) rather than serializing the live DOM.
function wrapCanvasText(ctx, text, maxWidth, maxLines) {
  const words = (text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(test).width > maxWidth) {
      lines.push(cur);
      if (lines.length === maxLines) return lines;
      cur = w;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

async function downloadDeckAsJpg() {
  const pages = document.querySelectorAll('#pagesContainer .deck-page');
  if (!pages.length) { alert('Build a deck first.'); return; }
  const scale = 2;
  const pxPerIn = 96 * scale;
  const pageW = 14 * pxPerIn, pageH = 8.5 * pxPerIn;
  const marginX = 0.6 * pxPerIn, marginY = 0.5 * pxPerIn;
  const contentW = pageW - marginX * 2;
  const cols = 3, gap = 24 * scale;
  const colW = (contentW - gap * (cols - 1)) / cols;
  const sans = '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
  const backdrop = getComputedStyle(document.documentElement).getPropertyValue('--backdrop').trim() || '#E8E6DE';

  for (let pi = 0; pi < pages.length; pi++) {
    const pageEl = pages[pi];
    const canvas = document.createElement('canvas');
    canvas.width = pageW; canvas.height = pageH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, pageW, pageH);
    ctx.textBaseline = 'alphabetic';

    const x = marginX;
    let y = marginY;

    const titleText = pageEl.querySelector('.deck-header h2')?.textContent || '';
    const dateText = pageEl.querySelector('.deck-header p')?.textContent || '';
    ctx.fillStyle = '#1a1a1a';
    ctx.font = '600 ' + (16 * scale) + 'px ' + sans;
    ctx.textAlign = 'left';
    ctx.fillText(titleText, x, y + 14 * scale);
    ctx.fillStyle = '#5F5E5A';
    ctx.font = (11 * scale) + 'px ' + sans;
    ctx.textAlign = 'right';
    ctx.fillText(dateText, x + contentW, y + 14 * scale);
    ctx.textAlign = 'left';

    const headerBottom = y + 14 * scale + 10 * scale;
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1 * scale;
    ctx.beginPath(); ctx.moveTo(x, headerBottom); ctx.lineTo(x + contentW, headerBottom); ctx.stroke();

    y = headerBottom + 20 * scale;

    const cards = pageEl.querySelectorAll('.deck-grid > div');
    cards.forEach((cardEl, ci) => {
      const cx = x + ci * (colW + gap);
      let cy = y;

      // Capped to match .deck-grid .imgwrap's CSS max-width (3.75in) -- letting the image fill
      // the full (wide, 2-col) column height pushed the text block below past the page bottom.
      const imgSize = Math.min(colW, 3.75 * pxPerIn);
      const imgX = cx + (colW - imgSize) / 2;
      ctx.fillStyle = backdrop;
      ctx.fillRect(imgX, cy, imgSize, imgSize);
      const canvasEl = cardEl.querySelector('canvas.branded-canvas');
      const imgEl = cardEl.querySelector('img.base');
      const srcEl = canvasEl || imgEl;
      const sw = canvasEl ? canvasEl.width : (imgEl ? imgEl.naturalWidth : 0);
      const sh = canvasEl ? canvasEl.height : (imgEl ? imgEl.naturalHeight : 0);
      if (srcEl && sw && sh) {
        const fit = Math.min(imgSize / sw, imgSize / sh);
        const dw = sw * fit, dh = sh * fit;
        try { ctx.drawImage(srcEl, imgX + (imgSize - dw) / 2, cy + (imgSize - dh) / 2, dw, dh); }
        catch (err) { console.warn('Could not draw image for JPG export', err); }
      }
      cy += imgSize + 10 * scale;

      const skuText = cardEl.querySelector('.sku')?.textContent || '';
      ctx.fillStyle = '#C7C5BB';
      ctx.font = (12 * scale) + 'px ' + sans;
      ctx.fillText(skuText, cx, cy + 9 * scale);
      cy += 20 * scale;

      const nameEl = cardEl.querySelector('.name');
      if (nameEl) {
        const eyebrowEl = nameEl.querySelector('.name-eyebrow');
        const mainEl = nameEl.querySelector('.name-main');
        const nameLineH = 18 * scale;
        let nameLines = 0;
        if (eyebrowEl) {
          ctx.fillStyle = '#918F86';
          ctx.font = 'bold ' + (13 * scale) + 'px ' + sans;
          const eLines = wrapCanvasText(ctx, eyebrowEl.textContent, colW, 1);
          eLines.forEach(line => { ctx.fillText(line, cx, cy + 10 * scale + nameLines * nameLineH); nameLines++; });
        }
        if (mainEl) {
          ctx.fillStyle = '#1a1a1a';
          ctx.font = 'bold ' + (15 * scale) + 'px ' + sans;
          const mLines = wrapCanvasText(ctx, mainEl.textContent, colW, 3 - nameLines);
          mLines.forEach(line => { ctx.fillText(line, cx, cy + 10 * scale + nameLines * nameLineH); nameLines++; });
        }
        cy += Math.max(nameLines, 1) * nameLineH + 6 * scale;
      }

      const descText = cardEl.querySelector('.desc')?.textContent || '';
      if (descText) {
        ctx.fillStyle = '#5F5E5A';
        ctx.font = (9 * scale) + 'px ' + sans;
        const descLineH = 12.6 * scale;
        const dLines = wrapCanvasText(ctx, descText, colW, 6);
        dLines.forEach((line, li) => ctx.fillText(line, cx, cy + 8 * scale + li * descLineH));
        cy += dLines.length * descLineH + 8 * scale;
      }

      const priceTable = cardEl.querySelector('.price-table');
      if (priceTable) {
        ctx.strokeStyle = '#E0DED5';
        ctx.lineWidth = 0.5 * scale;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + colW, cy); ctx.stroke();
        cy += 8 * scale;
        const tds = priceTable.querySelectorAll('td');
        const n = tds.length;
        const cellW = colW / n;
        tds.forEach((td, i) => {
          const qty = td.querySelector('.qty')?.textContent || '';
          const pr = td.querySelector('.pr')?.textContent || '';
          const align = i === 0 ? 'left' : (i === n - 1 ? 'right' : 'center');
          const tx = align === 'left' ? cx + i * cellW : (align === 'right' ? cx + (i + 1) * cellW : cx + i * cellW + cellW / 2);
          ctx.textAlign = align;
          ctx.fillStyle = '#918F86';
          ctx.font = (9 * scale) + 'px ' + sans;
          ctx.fillText(qty, tx, cy + 8 * scale);
          ctx.fillStyle = '#1a1a1a';
          ctx.font = '500 ' + (12 * scale) + 'px ' + sans;
          ctx.fillText(pr, tx, cy + 22 * scale);
        });
        ctx.textAlign = 'left';
        cy += 30 * scale;
      }

      const fees = cardEl.querySelector('.fees');
      if (fees) {
        ctx.strokeStyle = '#E0DED5';
        ctx.lineWidth = 0.5 * scale;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + colW, cy); ctx.stroke();
        cy += 12 * scale;
        ctx.fillStyle = '#5F5E5A';
        ctx.font = (10 * scale) + 'px ' + sans;
        fees.querySelectorAll('p').forEach(p => {
          if (!p.textContent) return;
          ctx.fillText(p.textContent, cx, cy);
          cy += 14 * scale;
        });
        let ax = cx;
        fees.querySelectorAll('.addon-row span').forEach(span => {
          const w = ctx.measureText(span.textContent).width;
          if (ax !== cx && ax + w > cx + colW) { ax = cx; cy += 14 * scale; }
          ctx.fillText(span.textContent, ax, cy);
          ax += w + 32 * scale;
        });
      }
    });

    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const pageSuffix = pages.length > 1 ? '-page' + (pi + 1) : '';
    const namePart = deckName ? '-' + slugify(deckName) : '-deck';
    triggerDownload(dataUrl, 'deckbuilder' + namePart + pageSuffix + '-' + fileTimestamp() + '.jpg');
  }
}

document.getElementById('downloadJpgBtn').addEventListener('click', () => downloadDeckAsJpg());

// --- Live product data (optional) ---
// Two sources, tried in order, each falling further back if the one before it fails:
//   1. PRODUCTS_SNAPSHOT_URL -- a static products.json, published via GitHub Pages off the same
//      repo/branch that serves every product photo via jsDelivr (see pushProductsSnapshotToGitHub
//      in google-apps-script.gs). Deliberately Pages, not jsDelivr, for this one file: jsDelivr's
//      cache needs an explicit purge call after every write, and that purge API has its own rate
//      limit -- fine for images (rarely overwritten) but this file gets pushed far more often, and
//      a burst of edits can throttle the purge, leaving stale data with no error to signal it.
//      Pages has no purge step at all; a push just republishes on its own, typically in well under
//      a minute. Images stay on jsDelivr on purpose -- Pages' own propagation isn't meaningfully
//      faster for content that rarely changes, and jsDelivr's purge-on-overwrite already works
//      fine at that write frequency.
//   2. SHEET_API_URL -- the Apps Script Web App reading the Sheet live. Kept only as a fallback
//      for the gap before the snapshot's first push, or if GitHub/Pages itself is ever down.
//   3. The bundled snapshot at the top of this file, if both of the above fail.
const PRODUCTS_SNAPSHOT_URL = 'https://williamlieuid.github.io/deckbuilder-images/products.json';
const SHEET_API_URL = 'https://deck-builder-api.deckbuilder.workers.dev';

// ---------- analytics (feeds deckbuilder-settings.html's Analytics tab) ----------
// Fire-and-forget: a failed beacon should never surface an error to a rep or block anything they're
// doing, so errors are swallowed silently. Uses the Worker's logAnalyticsEvent action, which is
// deliberately not gated behind the admin secret (see cloudflare-worker.js) since this file has no
// secret embedded in it at all.
function logAnalyticsEvents(events) {
  if (!events || !events.length) return;
  fetch(SHEET_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'logAnalyticsEvent', events })
  }).catch(() => {});
}

// Shared by both sources below so applying a fresh product list never drifts between them.
function applyLoadedProducts(data, sourceLabel) {
  PRODUCTS = data;
  selected.clear();
  populateCategoryDropdown();
  maxPriceByCurrency = computeMaxPriceByCurrency();
  computeSearchNames();
  updateBudgetPlaceholders();
  // currentResults holds references to old bundled product objects — remap to fresh ones
  // so descriptions, pricing and any other fields reflect the newly loaded data.
  if (currentResults.length) {
    const bySkU = new Map(PRODUCTS.map(p => [p.sku, p]));
    currentResults = currentResults.map(p => bySkU.get(p.sku) || p).filter(p => bySkU.has(p.sku));
  }
  refreshIfSearched();
  console.log('Loaded ' + PRODUCTS.length + ' products from ' + sourceLabel + '.');
}
function isValidProductsPayload(data) {
  return Array.isArray(data) && data.length && data[0].sku && data[0].tiers;
}

async function loadProductsFromSnapshot() {
  if (!PRODUCTS_SNAPSHOT_URL) return false;
  try {
    const res = await fetch(PRODUCTS_SNAPSHOT_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!isValidProductsPayload(data)) throw new Error('Unexpected response shape');
    applyLoadedProducts(data, 'the GitHub snapshot');
    return true;
  } catch (err) {
    console.warn('Could not load the GitHub products snapshot, falling back to the live sheet.', err);
    return false;
  }
}

// Apps Script Web Apps bound to a Sheet occasionally throw a one-off "unable to open the file"
// error under nothing more than a quick burst of requests (their concurrency/rate limits are
// tight for a free-tier service, and get worse once more than one person has the Sheet open at
// once) -- almost always gone on the very next call. One retry after a short pause absorbs that
// class of blip so a single transient hiccup doesn't fall all the way back to the bundled
// snapshot's null image URLs; a second real failure still falls back exactly as before. This is
// now only reached at all when loadProductsFromSnapshot() above has already failed.
async function loadProductsFromSheet() {
  if (!SHEET_API_URL) return;
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      const res = await fetch(SHEET_API_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!isValidProductsPayload(data)) throw new Error('Unexpected response shape');
      applyLoadedProducts(data, 'Google Sheets');
      return;
    } catch (err) {
      if (attempt === 1) {
        console.warn('Live product fetch failed, retrying once…', err);
        await new Promise(r => setTimeout(r, 1500));
        continue;
      }
      console.warn('Could not load live product data from Google Sheets, using bundled snapshot instead.', err);
    }
  }
}

async function loadProducts() {
  const gotSnapshot = await loadProductsFromSnapshot();
  if (!gotSnapshot) await loadProductsFromSheet();
}
loadProducts();
renderLogoHistory();

// ---------- dark mode ----------
// The actual data-theme attribute (if any override is stored) is already applied synchronously in
// <head>, before first paint -- this just keeps the toggle button's icon in sync with whatever
// theme ends up effective, including the no-override case where the system setting decides it.
const THEME_KEY = 'deckbuilder_theme';
function getStoredTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
function effectiveTheme() {
  const stored = getStoredTheme();
  if (stored === 'light' || stored === 'dark') return stored;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyThemeIcon() {
  const eff = effectiveTheme();
  document.getElementById('themeToggleIconSun').style.display = eff === 'dark' ? 'block' : 'none';
  document.getElementById('themeToggleIconMoon').style.display = eff === 'light' ? 'block' : 'none';
}
function setTheme(theme) {
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* storage unavailable -- toggle still works this session, just doesn't persist */ }
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeIcon();
}
applyThemeIcon();
document.getElementById('themeToggleBtn').addEventListener('click', () => {
  setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark');
});
// Keeps the icon (and, since no override is stored, the actual theme) following the OS live if the
// system setting changes while this tab is open -- only matters when there's no explicit override.
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!getStoredTheme()) applyThemeIcon();
  });
}

// Show every product immediately on page open (using the bundled snapshot) rather than leaving
// the grid blank until a rep types or checks something -- an unfiltered run of the same live
// filtering every field change now triggers. refreshIfSearched() already re-renders once live data
// replaces the snapshot, so this doesn't need its own separate re-render call.
applyFilters();



</script>
