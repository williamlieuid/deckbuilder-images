function priceBox(p) {
  if (!pricingOn()) return '';
  const addonLines = p.addons.filter(a => a.price).map(a => `<span>${a.name}: +${fmtPrice(a.price)}/unit</span>`).join('');
  if (!p.tiers.length) {
    return `
    <div class="fees">
      <p>Pricing not available — contact for quote</p>
      <div class="addon-row">${addonLines}</div>
    </div>`;
  }
  const last = p.tiers.length - 1;
  const cells = p.tiers.map((t, i) => `
    <td style="text-align:${i===0?'left':i===last?'right':'center'};">
      <p class="qty">${t.qty} units</p>
      <p class="pr">${fmtPrice(currency() === 'CAD' ? t.priceCAD : t.priceUS)}</p>
    </td>`).join('');
  return `
    <table class="price-table"><tr>${cells}</tr></table>
    <div class="fees">
      ${p.setupFee ? `<p>Setup: ${fmtPrice(p.setupFee)} one-time</p>` : ''}
      <div class="addon-row">${addonLines}</div>
    </div>`;
}

function truncateText(text, max) {
  if (text.length <= max) return text;
  const cut = text.slice(0, max);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut) + '…';
}
function truncateWords(text, maxWords) {
  if (!text) return '';
  const words = text.trim().split(/\s+/);
  if (words.length <= maxWords) return text;
  return words.slice(0, maxWords).join(' ') + '…';
}

function formatName(name) {
  const idx = name.indexOf(':');
  if (idx === -1) return `<span class="name-main">${name}</span>`;
  const eyebrow = name.slice(0, idx+1);
  const main = name.slice(idx+1).trim();
  return `<span class="name-eyebrow">${eyebrow}</span><br><span class="name-main">${main}</span>`;
}

// ============ perspective-warp engine ============
// Canvas2D has no native warpPerspective, so region branding uses a homography
// (for contain-fit-centered sizing) plus 2-triangle affine subdivision (for the
// actual pixel warp) — same math validated in the standalone masking-tool prototype.

function solveLinearSystem(A, b) {
  const n = A.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < n; col++) {
    let maxRow = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[maxRow][col])) maxRow = r;
    [M[col], M[maxRow]] = [M[maxRow], M[col]];
    const pivot = M[col][col];
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = M[r][col] / pivot;
      for (let c = col; c <= n; c++) M[r][c] -= factor * M[col][c];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

function solveHomography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const { x, y } = src[i], X = dst[i].x, Y = dst[i].y;
    A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]); b.push(Y);
  }
  const h = solveLinearSystem(A, b);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
}

function applyHomographyPt(H, p) {
  const w = H[6] * p.x + H[7] * p.y + H[8];
  return { x: (H[0] * p.x + H[1] * p.y + H[2]) / w, y: (H[3] * p.x + H[4] * p.y + H[5]) / w };
}

function solveAffine(src, dst) {
  const A = src.map(p => [p.x, p.y, 1]);
  const [a, c, e] = solveLinearSystem(A, dst.map(p => p.x));
  const [b, d, f] = solveLinearSystem(A, dst.map(p => p.y));
  return [a, b, c, d, e, f];
}

// warpImageIntoQuad splits the destination quad into two triangles sharing one diagonal, each
// warped by its OWN affine transform (a true perspective warp isn't affine, so one transform
// can't represent the whole quad -- two triangles is the standard way around that). The two
// transforms only agree exactly at the diagonal's two shared vertices; anywhere else along that
// edge they can disagree by a sub-pixel amount, and each triangle's own clip path is separately
// anti-aliased there too. On a normal photographic logo that shows up as an imperceptible sub-
// pixel blend, but on a flat single-color fill (knockout or the "Colorize Logo" tint) there's no
// color variation to hide it in, so it reads as a visible hairline seam along the diagonal.
// Inflating the CLIP path outward from the triangle's own centroid (not the transform, which
// still uses the true triangle correspondence) makes the two triangles overlap by a hair instead
// of meeting edge-to-edge -- redundant opaque overdraw in that sliver is invisible, unlike a gap.
function inflateTriangle(tri, eps) {
  const cx = (tri[0].x + tri[1].x + tri[2].x) / 3, cy = (tri[0].y + tri[1].y + tri[2].y) / 3;
  return tri.map(p => {
    const dx = p.x - cx, dy = p.y - cy, len = Math.hypot(dx, dy) || 1;
    return { x: p.x + (dx / len) * eps, y: p.y + (dy / len) * eps };
  });
}
function warpTriangle(ctx, img, srcTri, dstTri) {
  ctx.save();
  const clipTri = inflateTriangle(dstTri, 0.75);
  ctx.beginPath();
  ctx.moveTo(clipTri[0].x, clipTri[0].y); ctx.lineTo(clipTri[1].x, clipTri[1].y); ctx.lineTo(clipTri[2].x, clipTri[2].y);
  ctx.closePath(); ctx.clip();
  const m = solveAffine(srcTri, dstTri);
  ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

function warpImageIntoQuad(ctx, img, dstQuad) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const sTL = { x: 0, y: 0 }, sTR = { x: w, y: 0 }, sBR = { x: w, y: h }, sBL = { x: 0, y: h };
  warpTriangle(ctx, img, [sTL, sTR, sBL], [dstQuad[0], dstQuad[1], dstQuad[3]]);
  warpTriangle(ctx, img, [sTR, sBR, sBL], [dstQuad[1], dstQuad[2], dstQuad[3]]);
}

// Same warp as above, but lets the product's own photo show through the logo (multiply-shaded,
// same idea as the pattern's automatic shading) instead of a flat opaque decal -- picks up the
// product's real folds/shadows/highlights. Naively drawing the photo with globalCompositeOperation
// 'multiply' straight onto the already-warped logo would also incorrectly paint the photo into the
// fully-transparent area around the logo (per the canvas compositing spec, multiplying onto an
// empty/alpha-0 backdrop degrades to a plain opaque source-over draw there) -- so this warps onto
// an isolated scratch layer first, multiplies the photo onto THAT, then re-clips back to the
// logo's own silhouette with a second 'destination-in' pass using the same warp, before compositing
// the (correctly shaded, correctly bounded) result onto the real target.
// Multiply-shading only helps on a light, fairly neutral base (subtle real shadows/highlights
// added on top) -- on a near-black or dark-wood product it instead crushes the pattern/logo
// toward black or muddies it with the wood's own warm cast. Sampled once per card (base image
// doesn't change per-region) on a small downsampled canvas rather than scanning full-res pixels.
const DARK_SHADING_THRESHOLD = 110; // average 0-255 luminance below this = skip shading
// getImageData forces a GPU->CPU readback -- expensive enough (measured ~50-60ms each) that
// running it fresh for every product on every render dominated total render time (79 products
// -> ~4.5s of a ~10.8s render was this call alone), even though a product's base photo is the
// same <img> object every single time (loadImageCached never re-fetches it) and its darkness
// can never change. Cache the verdict per image object so the readback only ever happens once
// per base image for the life of the page, not once per render.
const isDarkBaseCache = new WeakMap();
function isDarkBase(img) {
  if (isDarkBaseCache.has(img)) return isDarkBaseCache.get(img);
  const SAMPLE = 16;
  const c = document.createElement('canvas');
  c.width = SAMPLE; c.height = SAMPLE;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, SAMPLE, SAMPLE);
  let data;
  try { data = cx.getImageData(0, 0, SAMPLE, SAMPLE).data; }
  catch (err) { return false; } // tainted canvas (uncommon local/CDN edge case) -- default to shading on rather than fail the render; deliberately NOT cached, so a transient CORS hiccup can resolve differently on a later retry
  let sum = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 10) continue;
    sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    count++;
  }
  const result = count ? (sum / count) < DARK_SHADING_THRESHOLD : false;
  isDarkBaseCache.set(img, result);
  return result;
}

function warpImageIntoQuadShaded(targetCtx, img, dstQuad, baseImg, dx, dy, dw, dh, size) {
  const scratch = document.createElement('canvas');
  scratch.width = size; scratch.height = size;
  const sctx = scratch.getContext('2d');
  warpImageIntoQuad(sctx, img, dstQuad);
  // Snapshot the logo's own silhouette (opaque only within dstQuad, transparent everywhere else on
  // the full-size canvas) BEFORE multiplying -- warpImageIntoQuad clips each triangle draw to its own
  // destination triangle, so re-running it a second time for the "destination-in" re-clip below would
  // only ever confirm pixels already inside that triangle: a canvas clip blocks ANY compositing effect,
  // including erasing via destination-in, outside itself. The multiply step below paints opaque across
  // the whole dx/dy/dw/dh base-image box (multiplying onto a transparent backdrop degrades to a plain
  // opaque draw there, per the canvas compositing spec), so the re-clip needs to reach that entire box
  // unclipped in order to actually erase it back down to just the logo's shape.
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = size; maskCanvas.height = size;
  maskCanvas.getContext('2d').drawImage(scratch, 0, 0);
  sctx.globalCompositeOperation = 'multiply';
  sctx.drawImage(baseImg, dx, dy, dw, dh);
  sctx.globalCompositeOperation = 'destination-in';
  sctx.drawImage(maskCanvas, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  targetCtx.drawImage(scratch, 0, 0);
}

function quadDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// Detects whether a quad's 4 points wind the same direction as the canonical TL->TR->BR->BL unit
// square (0,0)->(1,0)->(1,1)->(0,1) that every homography below is built against, and flips it
// back to canonical (keeping the same first point, reversing the rest) if not -- works in either
// percent or pixel space since only the SIGN of the shoelace sum matters, not its scale.
function normalizeQuadWinding(quad) {
  let sum = 0;
  for (let i = 0; i < quad.length; i++) {
    const a = quad[i], b = quad[(i + 1) % quad.length];
    sum += a.x * b.y - b.x * a.y;
  }
  return sum >= 0 ? quad : [quad[0], quad[3], quad[2], quad[1]];
}

// Contain-fit-centered sub-quad within a full region quad, optionally centered on a
// custom point (normalized 0-1 within the quad) instead of the quad's own geometric middle.
function containFitSubQuad(quad, logoW, logoH, centerUV, scaleMult) {
  const [tl, tr, br, bl] = quad;
  const width = (quadDist(tr, tl) + quadDist(br, bl)) / 2;
  const height = (quadDist(bl, tl) + quadDist(br, tr)) / 2;
  const quadAspect = width / height, logoAspect = logoW / logoH;
  let normW, normH;
  if (logoAspect > quadAspect) { normW = 1; normH = quadAspect / logoAspect; }
  else { normH = 1; normW = logoAspect / quadAspect; }
  // Small margin so a logo that exactly fills its constraining dimension doesn't touch the
  // region's edge — a shrink on both axes, so it applies equally whichever dimension is the
  // tight one. Modest on purpose: a long region with a long logo (already has natural side
  // margin from the aspect mismatch, not from this) barely changes; a case where the logo
  // currently touches the edge gets real breathing room.
  const LOGO_PADDING_FRAC = 0.15;
  normW *= 1 - LOGO_PADDING_FRAC * 2;
  normH *= 1 - LOGO_PADDING_FRAC * 2;
  // Session-only per-region nudge on top of the natural contain-fit size (the card's Logo Size
  // +/-/Reset control) -- applied after padding, around the same center point, so scaling up
  // grows the logo outward symmetrically rather than shifting it toward one corner. u0/v0 below
  // already clamp to the quad's own 0-1 bounds, so an aggressive scale-up simply reaches the
  // region's edge rather than warping past it.
  if (scaleMult && scaleMult !== 1) { normW *= scaleMult; normH *= scaleMult; }
  const cu = centerUV ? centerUV.x : 0.5, cv = centerUV ? centerUV.y : 0.5;
  const u0 = Math.max(0, Math.min(1 - normW, cu - normW / 2));
  const v0 = Math.max(0, Math.min(1 - normH, cv - normH / 2));
  const u1 = u0 + normW, v1 = v0 + normH;
  const H = solveHomography([{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }], quad);
  return [{ x: u0, y: v0 }, { x: u1, y: v0 }, { x: u1, y: v1 }, { x: u0, y: v1 }].map(p => applyHomographyPt(H, p));
}

function computeCenterUV(quad, centerPt) {
  if (!centerPt) return null;
  const Hinv = solveHomography(quad, [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }]);
  return applyHomographyPt(Hinv, centerPt);
}

// Mask-only logo placement: three whole-image-pct points (center + one endpoint per axis) define
// a parallelogram to warp the logo directly into, no aspect-ratio preservation -- unlike
// containFitSubQuad's contain-fit, this lets each axis be independently rotated/stretched/sheared
// (the masking tool's axis-handle tool), since a mask's bounding box carries no orientation info
// of its own the way poly's own corners or rect's rotateCCW do.
function quadFromAxis(logoAxis, dx, dy, dw, dh) {
  const toPx = p => ({ x: dx + (p.x / 100) * dw, y: dy + (p.y / 100) * dh });
  const center = toPx(logoAxis.center), xEnd = toPx(logoAxis.xEnd), yEnd = toPx(logoAxis.yEnd);
  const xVec = { x: xEnd.x - center.x, y: xEnd.y - center.y };
  const yVec = { x: yEnd.x - center.x, y: yEnd.y - center.y };
  return [
    { x: center.x - xVec.x - yVec.x, y: center.y - xVec.y - yVec.y },
    { x: center.x + xVec.x - yVec.x, y: center.y + xVec.y - yVec.y },
    { x: center.x + xVec.x + yVec.x, y: center.y + xVec.y + yVec.y },
    { x: center.x - xVec.x + yVec.x, y: center.y - xVec.y + yVec.y }
  ];
}

// General-purpose 0/90/180/270 clockwise rotation (steps = how many 90° clockwise turns), used
// directly by the region-rotate-override feature below. getRotatedLogoSource (single-step,
// boolean-driven) stays the pattern-tiling entry point unchanged -- only the logo path needs
// multi-step rotation, and reusing this as its implementation keeps both consistent.
function rotateImageSteps(img, steps) {
  steps = ((steps % 4) + 4) % 4;
  if (steps === 0) return img;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  if (steps === 2) {
    off.width = w; off.height = h;
    octx.translate(w, h); octx.rotate(Math.PI);
  } else if (steps === 1) {
    off.width = h; off.height = w;
    octx.translate(h, 0); octx.rotate(Math.PI / 2);
  } else { // steps === 3
    off.width = h; off.height = w;
    octx.translate(0, w); octx.rotate(-Math.PI / 2);
  }
  octx.drawImage(img, 0, 0);
  return off;
}
function getRotatedLogoSource(logoImg, rotateCCW, rotateCW) {
  return rotateImageSteps(logoImg, rotateCW ? 1 : (rotateCCW ? 3 : 0));
}

// radiusPx may be a single number (uniform, all corners) or a 4-element array (per-corner,
// TL/TR/BR/BL matching points' own order) — the masking tool's independent-corner-radius option.
function roundedRegionClipPath(ctx, points, radiusPx) {
  const n = points.length;
  const radii = Array.isArray(radiusPx) ? radiusPx : new Array(n).fill(radiusPx || 0);
  if (radii.every(r => !r || r <= 0)) {
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath();
    return;
  }
  for (let i = 0; i < n; i++) {
    const prev = points[(i - 1 + n) % n], cur = points[i], next = points[(i + 1) % n];
    const toPrev = normVec(prev.x - cur.x, prev.y - cur.y), toNext = normVec(next.x - cur.x, next.y - cur.y);
    const r = Math.min(radii[i] || 0, quadDist(prev, cur) / 2, quadDist(next, cur) / 2);
    const p1 = { x: cur.x + toPrev.x * r, y: cur.y + toPrev.y * r };
    const p2 = { x: cur.x + toNext.x * r, y: cur.y + toNext.y * r };
    if (i === 0) ctx.moveTo(p1.x, p1.y); else ctx.lineTo(p1.x, p1.y);
    ctx.arcTo(cur.x, cur.y, p2.x, p2.y, r);
  }
  ctx.closePath();
}
function normVec(dx, dy) { const l = Math.hypot(dx, dy) || 1; return { x: dx / l, y: dy / l }; }

function getColorizedLogoSource(logoImg, hexColor) {
  const w = logoImg.naturalWidth || logoImg.width, h = logoImg.naturalHeight || logoImg.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.drawImage(logoImg, 0, 0);
  cx.globalCompositeOperation = 'source-in';
  cx.fillStyle = hexColor;
  cx.fillRect(0, 0, w, h);
  return c;
}
function getKnockoutLogoSource(logoImg) {
  return getColorizedLogoSource(logoImg, '#ffffff');
}
// Black leather's laser-etched look: a solid black knockout of the logo shape, same mechanism as
// the white pattern-knockout above just with the color swapped -- there was previously no black-
// leather-specific treatment at all in drawBrandedCard, so this is the first time this material
// actually renders differently from a normal full-color logo.
function getBlackKnockoutLogoSource(logoImg) {
  return getColorizedLogoSource(logoImg, '#000000');
}

const WOOD_ENGRAVE_COLOR = '#786957';
// Simulates a ~1mm laser-cut recess, lit from directly above: fills the logo's own silhouette
// with the wood-recess color, then adds a soft dark band hugging the TOP inside edge (the recess's
// upper inner wall falls into its own shadow, since the light from above never reaches straight
// down into a vertical wall facing up) and a soft light band hugging the BOTTOM inside edge (the
// lower inner wall catches that same overhead light at a grazing angle). Built the same way as
// getKnockoutLogoSource above -- returns a plain canvas consumed identically by the existing
// contain-fit/warp pipeline, so no other rendering code needs to know this isn't a normal logo.
function getWoodEngravedLogoSource(logoImg) {
  const w = logoImg.naturalWidth || logoImg.width, h = logoImg.naturalHeight || logoImg.height;
  // Padded so the blurred shadow/highlight bands have room to fall off before the canvas edge —
  // a shape whose silhouette touches the source image's own edge would otherwise get its band cut
  // off flat there instead of softly fading, one more reason a plain crop-to-content isn't enough.
  const pad = Math.round(Math.max(w, h) * 0.03) + 4;
  const cw = w + pad * 2, ch = h + pad * 2;

  const silhouette = document.createElement('canvas');
  silhouette.width = cw; silhouette.height = ch;
  const sctx = silhouette.getContext('2d');
  sctx.drawImage(logoImg, pad, pad, w, h);
  sctx.globalCompositeOperation = 'source-in';
  sctx.fillStyle = '#ffffff';
  sctx.fillRect(0, 0, cw, ch);

  // Recess depth is expressed relative to the logo's own size (not a fixed pixel count), so the
  // effect scales sensibly whether this logo ends up tiny or huge on the final card.
  const offsetPx = Math.max(1, Math.round(Math.min(w, h) * 0.015));
  const blurPx = offsetPx * 2;

  // The sliver of the silhouette that a copy of itself, translated by (0, dy), no longer covers —
  // i.e. exactly the edge band on the side the translation moved AWAY from.
  function edgeBand(dy) {
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const cx = c.getContext('2d');
    cx.drawImage(silhouette, 0, 0);
    cx.globalCompositeOperation = 'destination-out';
    cx.drawImage(silhouette, 0, dy);
    return c;
  }
  const topShadowBand = edgeBand(offsetPx);
  const bottomHighlightBand = edgeBand(-offsetPx);

  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  const octx = out.getContext('2d');

  octx.drawImage(silhouette, 0, 0);
  octx.globalCompositeOperation = 'source-in';
  octx.fillStyle = WOOD_ENGRAVE_COLOR;
  octx.fillRect(0, 0, cw, ch);
  octx.globalCompositeOperation = 'source-over';

  octx.save();
  octx.filter = `blur(${blurPx}px)`;
  octx.globalAlpha = 0.55;
  octx.globalCompositeOperation = 'multiply';
  octx.drawImage(topShadowBand, 0, 0);
  octx.restore();

  octx.save();
  octx.filter = `blur(${blurPx}px)`;
  octx.globalAlpha = 0.45;
  octx.globalCompositeOperation = 'screen';
  octx.drawImage(bottomHighlightBand, 0, 0);
  octx.restore();

  // Blur inevitably pushes shadow/highlight color outside the true silhouette edge -- clip back to
  // exactly the logo's own shape so nothing bleeds onto the surrounding wood surface.
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(silhouette, 0, 0);
  octx.globalCompositeOperation = 'source-over';

  return out;
}

const CLEAR_ETCH_COLOR = '#D9D9D9';
// Simulates a laser-etched mark on clear/frosted acrylic (e.g. ClearCharge): a light grey,
// slightly translucent fill (acrylic is see-through, so the surface under the mark should still
// read faintly through it, unlike wood's fully opaque recess) plus a soft outward blur pass
// underneath it -- a real laser scatters light a little beyond its exact vector path etching into
// acrylic, which reads as a faint soft halo around the crisp mark rather than a hard edge. Built
// the same knockout-silhouette technique as getKnockoutLogoSource/getWoodEngravedLogoSource above.
function getClearEtchedLogoSource(logoImg) {
  const w = logoImg.naturalWidth || logoImg.width, h = logoImg.naturalHeight || logoImg.height;
  const pad = Math.round(Math.max(w, h) * 0.04) + 4;
  const cw = w + pad * 2, ch = h + pad * 2;

  const silhouette = document.createElement('canvas');
  silhouette.width = cw; silhouette.height = ch;
  const sctx = silhouette.getContext('2d');
  sctx.drawImage(logoImg, pad, pad, w, h);
  sctx.globalCompositeOperation = 'source-in';
  sctx.fillStyle = CLEAR_ETCH_COLOR;
  sctx.fillRect(0, 0, cw, ch);

  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  const octx = out.getContext('2d');

  const blurPx = Math.max(1, Math.round(Math.min(w, h) * 0.02));
  octx.save();
  octx.filter = `blur(${blurPx}px)`;
  octx.globalAlpha = 0.5;
  octx.drawImage(silhouette, 0, 0);
  octx.restore();

  octx.save();
  octx.globalAlpha = 0.88;
  octx.drawImage(silhouette, 0, 0);
  octx.restore();

  return out;
}

// Draws base image (contain-fit into a square canvas, backdrop-filled), the pattern fill
// clipped to each defined region's own shape (rect/poly/mask — never the whole product), the
// logo warped on top within that same region (knocked out to a white silhouette when
// patterning), and an optional hand-crafted overlay. The poly region gets its pattern tiles
// perspective-warped through the region's own homography instead of flat-tiled, so a diagonal
// product shot doesn't look like a flat decal; rect/mask stay flat-tiled since they don't carry
// perspective info the way a hand-placed 4-corner quad does.
function drawBrandedCard(canvas, baseImg, logoImg, regions, backdropColor, size, pattern, maskImageCache, logoMultiply, woodProduct, clearProduct, blackProduct, fullColorOverride) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  // "transparent" leaves the canvas's own already-clear alpha channel alone instead of filling it
  // -- the letterboxed margin around the product photo then stays genuinely transparent in a PNG
  // export, rather than baking in an opaque color.
  if (backdropColor !== 'transparent') { ctx.fillStyle = backdropColor; ctx.fillRect(0, 0, size, size); }

  const iw = baseImg.naturalWidth || baseImg.width, ih = baseImg.naturalHeight || baseImg.height;
  const scale = Math.min(size / iw, size / ih);
  const dw = iw * scale, dh = ih * scale, dx = (size - dw) / 2, dy = (size - dh) / 2;
  ctx.drawImage(baseImg, dx, dy, dw, dh);
  const pctToCanvas = pt => ({ x: dx + (pt.x / 100) * dw, y: dy + (pt.y / 100) * dh });

  // A logo is no longer required — a pattern-eligible product can be fully-bleed artwork with
  // its own logo already baked in, so pattern-only branding (no separate logo warp) is valid too.
  if (!regions || (!logoImg && !(pattern && pattern.img))) return;

  // fullColorOverride skips straight past every material-specific treatment below -- a preview of
  // "what would this look like in full color" for a material that would never actually ship that
  // way, not a real production option (see toggleMaterialFullColor's own comment). Single combined
  // flag (rather than three separate material booleans) threaded down into paintRegionContent,
  // where it gates whether a per-region colorize override is allowed to touch the logo at all --
  // a fixed physical-material simulation isn't a colorize target the way a normal logo is.
  const materialLockedLook = !fullColorOverride && (blackProduct || woodProduct || clearProduct);
  const baseLogoSrc = !logoImg ? null
    : (blackProduct && !fullColorOverride) ? getBlackKnockoutLogoSource(logoImg)
    : (woodProduct && !fullColorOverride) ? getWoodEngravedLogoSource(logoImg)
    : (clearProduct && !fullColorOverride) ? getClearEtchedLogoSource(logoImg)
    : (pattern && pattern.knockout) ? getKnockoutLogoSource(logoImg)
    : logoImg;
  const skipShading = isDarkBase(baseImg);

  // A sibling rect never gets its own heightIn (only poly does), so it can never disagree with
  // itself about which axis widthIn measures -- it's already the unambiguous shared long-axis
  // value the moment a rect exists. Only fall back to guessing (larger of widthIn/heightIn = long)
  // when there's no rect to anchor against, e.g. a poly-only product like a book cover shot at an
  // angle, where nothing else pins down which real measurement lines up with this photo's framing.
  const hasRectAnchor = !!(regions.rect && regions.rect.widthIn);

  // A product can have more than one brandable spot (masking tool's "+ Add another branding area
  // for this SKU") -- regions.extra is a flat, variable-length list of additional rect/poly/mask
  // regions beyond the primary three, each self-tagged with its own `kind` since it isn't pinned
  // to a fixed named slot the way rect/poly/mask are. Loop over primary + extra uniformly; the
  // painting logic below doesn't care which list a region came from.
  const regionList = ['rect', 'poly', 'mask']
    .filter(kind => regions[kind])
    .map(kind => ({ kind, region: regions[kind] }))
    .concat((regions.extra || []).map(region => ({ kind: region.kind, region })));

  const canvasToPct = (px, py) => ({ x: (px - dx) / dw * 100, y: (py - dy) / dh * 100 });
  regionList.forEach(({ kind, region }) => {
    if (kind === 'mask') {
      const maskCanvas = buildMaskClipCanvas(region, size, pctToCanvas, maskImageCache);
      const quadPct = maskBoundingQuadPct(region, maskCanvas, canvasToPct);
      const quad = quadPct.map(pctToCanvas);
      const allAxes = [region.logoAxis].concat(region.extraLogoAxes || []).filter(Boolean);
      const axesForRender = allAxes.length > 0 ? allAxes : [null];
      // Canvas-space centers for Voronoi partitioning: paintRegionContent fills the full
      // mask bounding quad (all islands), so without partitioning each iteration's fill
      // overwrites all previous islands and only the last axis survives.
      const canvasCenters = allAxes.map(a => pctToCanvas(a.center));
      // Build all per-island clip masks up front (one getImageData pass per island) rather than
      // inside the render loop — avoids allocating N extra canvases concurrently mid-loop which
      // compounds the memory pressure that crashes Chrome on mobile.
      let islandClips = null;
      if (canvasCenters.length > 1) {
        const baseData = maskCanvas.getContext('2d').getImageData(0, 0, size, size).data;
        islandClips = canvasCenters.map((cc, axisIdx) => {
          const im = document.createElement('canvas');
          im.width = size; im.height = size;
          const imc = im.getContext('2d');
          const imgData = imc.createImageData(size, size);
          const d = imgData.data;
          for (let py = 0; py < size; py++) {
            for (let px = 0; px < size; px++) {
              const idx = (py * size + px) * 4;
              if (baseData[idx + 3] === 0) continue;
              const di = (px - cc.x) * (px - cc.x) + (py - cc.y) * (py - cc.y);
              let nearest = true;
              for (let j = 0; j < canvasCenters.length; j++) {
                if (j === axisIdx) continue;
                const dj = (px - canvasCenters[j].x) * (px - canvasCenters[j].x) + (py - canvasCenters[j].y) * (py - canvasCenters[j].y);
                if (dj < di) { nearest = false; break; }
              }
              if (nearest) { d[idx] = baseData[idx]; d[idx+1] = baseData[idx+1]; d[idx+2] = baseData[idx+2]; d[idx+3] = baseData[idx+3]; }
            }
          }
          imc.putImageData(imgData, 0, 0);
          return im;
        });
      }
      axesForRender.forEach((axis, axisIdx) => {
        const scratch = document.createElement('canvas');
        scratch.width = size; scratch.height = size;
        const sctx = scratch.getContext('2d');
        const regionForAxis = axis !== null ? Object.assign({}, region, { logoAxis: axis }) : region;
        paintRegionContent(sctx, quad, quadPct, regionForAxis, pattern, baseLogoSrc, logoImg, baseImg, dx, dy, dw, dh, size, false, hasRectAnchor, logoMultiply, skipShading, materialLockedLook);
        sctx.globalCompositeOperation = 'destination-in';
        sctx.drawImage(islandClips ? islandClips[axisIdx] : maskCanvas, 0, 0);
        ctx.drawImage(scratch, 0, 0);
      });
      return;
    }

    const quadPct = kind === 'rect'
      ? [{ x: region.x, y: region.y }, { x: region.x + region.w, y: region.y },
         { x: region.x + region.w, y: region.y + region.h }, { x: region.x, y: region.y + region.h }]
      : region.corners;
    const quad = quadPct.map(pctToCanvas);

    ctx.save();
    const shortSideCanvasPx = Math.min(quadDist(quad[0], quad[1]), quadDist(quad[1], quad[2]));
    ctx.beginPath();
    const radiusArg = (region.uniformRadius === false && region.radii && region.radii.length === 4)
      ? region.radii.map(r => (r / 100) * shortSideCanvasPx)
      : (region.radius ? (region.radius / 100) * shortSideCanvasPx : 0);
    roundedRegionClipPath(ctx, quad, radiusArg);
    ctx.clip();
    // A poly's corners are stored in whatever order the masking tool user happened to click them
    // in -- fine for the clip path above (a simple polygon fills the same shape regardless of
    // winding direction) and for radiusArg (still indexed to that same original order), but the
    // homography-based warps inside paintRegionContent (logo contain-fit, perspective pattern
    // tiling, center-offset math) all implicitly assume the canonical TL->TR->BR->BL winding
    // baked into their own unit-square reference points. A poly clicked in the opposite order
    // describes the identical visible shape but produces a homography that mirrors (left-right
    // flips) whatever gets warped through it -- pass a winding-normalized copy here so the logo/
    // pattern render correctly regardless of click order, without touching the clip/radii above.
    const warpQuadPct = normalizeQuadWinding(quadPct);
    const warpQuad = warpQuadPct.map(pctToCanvas);
    paintRegionContent(ctx, warpQuad, warpQuadPct, region, pattern, baseLogoSrc, logoImg, baseImg, dx, dy, dw, dh, size, kind === 'poly', hasRectAnchor, logoMultiply, skipShading, materialLockedLook);
    ctx.restore();
  });
}

// Shared by all three region kinds: fills the pattern within whatever clip/target the caller
// set up (flat-tiled, or perspective-warped through the region's own quad when perspectiveTile
// is true), applies shading, then warps the logo on top.
function paintRegionContent(targetCtx, quad, quadPct, region, pattern, baseLogoSrc, rawLogoSrc, baseImg, dx, dy, dw, dh, size, perspectiveTile, hasRectAnchor, logoMultiply, skipShading, materialLockedLook) {
  // Per-region override of the card-wide logo source: __colorize (the "Colorize Logo" control)
  // always wins when set, regardless of pattern state -- it's a deliberate solid-color choice, not
  // tied to knockout-vs-pattern logic. Otherwise, __skipPattern (the "hide pattern" control) means
  // there's no pattern left under this one region to justify a plain white silhouette, so fall back
  // to the logo's real colors instead of the card-wide knocked-out version. Black-knockout, wood-
  // engraved, and clear-etched logos aren't affected while materialLockedLook is true -- those are
  // fixed physical-material simulations, not a knockout choice a rep can toggle per region (once
  // the laser/full-color button switches a product OUT of its material look, materialLockedLook is
  // false and colorize applies normally again, same as any other product).
  let effectiveLogoSrc = baseLogoSrc;
  if (baseLogoSrc && !materialLockedLook) {
    if (region.__colorize) effectiveLogoSrc = getColorizedLogoSource(rawLogoSrc, region.__colorize);
    else if (colorizeAll) effectiveLogoSrc = getColorizedLogoSource(rawLogoSrc, colorizeAllColor);
    else if (region.__skipPattern && pattern && pattern.knockout) effectiveLogoSrc = rawLogoSrc;
  }
  // Compute the logo's own contain-fit placement quad FIRST (before touching the pattern) so it's
  // ready once we get to drawing the logo on top -- the pattern below always fills the WHOLE
  // region regardless of the logo, never clipped down to just the logo's own area.
  let logoDst = null, logoSrcForDraw = null;
  if (effectiveLogoSrc) {
    // Session-only rotate override (the per-region rotate button on each product card) -- applied
    // up front to the raw logo source, before either placement branch, so contain-fit naturally
    // adapts to the rotated width/height in both cases with no other change needed.
    const overrideSteps = region.__extraRotateSteps || 0;
    const overriddenLogoSrc = overrideSteps ? rotateImageSteps(effectiveLogoSrc, overrideSteps) : effectiveLogoSrc;
    const logoScaleMult = region.__logoScale || 1;
    if (region.logoAxis) {
      // The axis handles already encode whatever rotation is wanted, continuously -- applying
      // rotateCCW's coarse 90° swap on top would double up, so skip it for this path only.
      // Blue/orange (xEnd/yEnd) define the axis quad's ORIENTATION and MAXIMUM extent, not a
      // shape to force-stretch the logo into -- contain-fit the logo within that quad (same
      // padding-buffered contain-fit rect/poly already use) so its own real aspect ratio always
      // wins regardless of how the two handles happen to be dragged.
      const axisQuad = quadFromAxis(region.logoAxis, dx, dy, dw, dh);
      const axisLogoW = overriddenLogoSrc.naturalWidth || overriddenLogoSrc.width, axisLogoH = overriddenLogoSrc.naturalHeight || overriddenLogoSrc.height;
      logoDst = containFitSubQuad(axisQuad, axisLogoW, axisLogoH, null, logoScaleMult);
      logoSrcForDraw = overriddenLogoSrc;
    } else {
      logoSrcForDraw = getRotatedLogoSource(overriddenLogoSrc, region.rotateCCW, region.rotateCW);
      const logoW = logoSrcForDraw.naturalWidth || logoSrcForDraw.width, logoH = logoSrcForDraw.naturalHeight || logoSrcForDraw.height;
      const centerUV = region.centerOffset ? computeCenterUV(quadPct, region.centerOffset) : null;
      logoDst = containFitSubQuad(quad, logoW, logoH, centerUV, logoScaleMult);
    }
  }

  if (pattern && (pattern.img || pattern.solidColor) && !region.__skipPattern) {
    if (pattern.solidColor) {
      // "Solid Fill" -- a flat color instead of a tiled image. Filled across the whole working
      // canvas, same as the tile loop below does; the caller's own clip (rect/poly) or destination-
      // in mask composite (mask regions) is what actually constrains it to the region's shape.
      targetCtx.fillStyle = pattern.solidColor;
      targetCtx.fillRect(0, 0, size, size);
    } else {
    // Same rotation the logo gets (region.rotateCCW) — otherwise a product with rect.rotateCCW
    // false and poly.rotateCCW true (Chisel: the flat and diagonal shots have different "up"
    // directions relative to the image) shows the pattern in two different orientations even
    // after phase-aligning them, since only the logo was ever being rotated to compensate.
    const patImgSrc = getRotatedLogoSource(pattern.img, region.rotateCCW, region.rotateCW);
    const patW = patImgSrc.naturalWidth || patImgSrc.width, patH = patImgSrc.naturalHeight || patImgSrc.height;
    const rawOffsetX = pattern.offsetX || 0, rawOffsetY = pattern.offsetY || 0;
    // The sliders are meant to mean "shift along the pattern's own natural horizontal/vertical"
    // consistently everywhere — but a 90°-rotated region's tile is drawn in ITS OWN (rotated)
    // axes, so the pattern's natural horizontal lands on the rotated tile's vertical axis. Swap
    // which raw slider drives which tiling axis here so "horizontal position" keeps meaning the
    // same thing regardless of whether this particular region happens to be rotated. The two
    // axes are NOT symmetric under a 90° CCW rotation, though: original-x maps onto the rotated
    // tile's Y axis WITH a sign flip, while original-y maps onto the rotated tile's X axis with
    // none (getRotatedLogoSource's transform is x'=y, y'=w-x) — so only the horizontal→Y leg of
    // the swap needs its sign negated, not the vertical→X leg. CW is the mirror-image rotation
    // (getRotatedLogoSource's CW transform is x'=h-y, y'=x), so its swap is the exact sign-opposite
    // of CCW's on both legs: original-x lands unflipped on the rotated tile's Y axis, original-y
    // lands flipped (negated) on its X axis.
    const offsetX = region.rotateCCW ? rawOffsetY : (region.rotateCW ? -rawOffsetY : rawOffsetX);
    const offsetY = region.rotateCCW ? -rawOffsetX : (region.rotateCW ? rawOffsetX : rawOffsetY);
    const tileSize = computeTileSizePx(region, quad, pattern.scale, size, perspectiveTile, hasRectAnchor);
    if (perspectiveTile) {
      paintPerspectivePatternPixels(targetCtx, patImgSrc, quad, size, tileSize, offsetX, offsetY, resolveRegionDimensionsIn(region, hasRectAnchor).shortIn, pattern.scale);
    } else {
      const tileW = tileSize;
      const tileH = tileW * (patH / patW);
      const offXpx = ((offsetX / 100) % 1 + 1) % 1 * tileW;
      const offYpx = ((offsetY / 100) % 1 + 1) % 1 * tileH;
      // Anchor the tile grid's phase to this region's own CENTER (not a corner) — anchoring at
      // quad[0] made scale grow outward from whichever corner the masking tool happened to order
      // first, which is on the opposite physical side for rect vs poly (arbitrary per-region, not
      // a real inconsistency in the code, but visually reads as "growing the wrong way"). The
      // center has no such arbitrary bias.
      const centerX = (quad[0].x + quad[1].x + quad[2].x + quad[3].x) / 4;
      const centerY = (quad[0].y + quad[1].y + quad[2].y + quad[3].y) / 4;
      const phaseX = ((centerX + offXpx) % tileW + tileW) % tileW;
      const phaseY = ((centerY + offYpx) % tileH + tileH) % tileH;
      const startX = phaseX - tileW;
      const startY = phaseY - tileH;
      // Round tile size once and step by that integer amount (rather than re-adding the float
      // tileW/tileH each loop) so adjacent tiles land on exact shared pixel boundaries — stepping
      // by a fractional size lets tiny sub-pixel gaps accumulate across the grid, and each gap
      // shows the backdrop through as a thin seam (visible as a full grid at higher repeat counts).
      const tileWi = Math.max(1, Math.round(tileW));
      const tileHi = Math.max(1, Math.round(tileH));
      for (let ty = Math.round(startY); ty < size + tileHi; ty += tileHi) {
        for (let tx = Math.round(startX); tx < size + tileWi; tx += tileWi) {
          targetCtx.drawImage(patImgSrc, tx, ty, tileWi, tileHi);
        }
      }
    }
    }
    if (pattern.overlayImg) {
      targetCtx.drawImage(pattern.overlayImg, 0, 0, size, size);
    } else if (!skipShading) {
      targetCtx.globalCompositeOperation = 'multiply';
      targetCtx.drawImage(baseImg, dx, dy, dw, dh);
      targetCtx.globalCompositeOperation = 'source-over';
    }
  }

  if (effectiveLogoSrc) {
    // Optional outline (the "Stroke" checkbox + color picker, session-wide via the strokeEnabled/
    // logoStrokeColor globals) so the logo stays readable against a busy pattern behind it --
    // rings it with several offset copies of its own silhouette in the chosen color, then draws the
    // real logo on top. A cheap, standard canvas outline technique (stamp the silhouette at N points
    // around a circle) rather than a true per-pixel dilation. Only meaningful with a pattern actually
    // behind the logo -- a stroke around a logo on a plain backdrop has nothing to separate it from.
    if (strokeEnabled && pattern && (pattern.img || pattern.solidColor) && !region.__skipPattern) {
      const strokeSrc = getColorizedLogoSource(logoSrcForDraw, logoStrokeColor);
      const xs = logoDst.map(p => p.x), ys = logoDst.map(p => p.y);
      const logoDstW = Math.max(...xs) - Math.min(...xs), logoDstH = Math.max(...ys) - Math.min(...ys);
      const strokePx = Math.max(2, Math.round(Math.min(logoDstW, logoDstH) * 0.035));
      const steps = 12;
      for (let i = 0; i < steps; i++) {
        const ang = (i / steps) * Math.PI * 2;
        const ox = Math.cos(ang) * strokePx, oy = Math.sin(ang) * strokePx;
        warpImageIntoQuad(targetCtx, strokeSrc, logoDst.map(p => ({ x: p.x + ox, y: p.y + oy })));
      }
    }
    if (logoMultiply && !skipShading) warpImageIntoQuadShaded(targetCtx, logoSrcForDraw, logoDst, baseImg, dx, dy, dw, dh, size);
    else warpImageIntoQuad(targetCtx, logoSrcForDraw, logoDst);
  }
}

// One tile's on-screen size in canvas px. If the region carries a real-world width (inches,
// set once in the masking tool from the product's actual spec), this is DERIVED from actual
// px-per-inch — the same formula for a flat region and a perspective one, since a region's own
// quad already encodes its true apparent size (including foreshortening) once you know what it
// really measures. That's what makes patterns match across regions/products with no per-region
// fudge factor. Falls back to the old screen-relative behavior (with its empirically-matched
// PERSPECTIVE_SCALE_CORRECTION, tuned to Chisel specifically and known not to generalize — see
// project memory) when no real-world width has been entered for this region.
// "100%" is deliberately bigger than a literal 1:1 unit (1 inch, or 1/1 of the old screen-relative
// guess) -- at true 1:1 the tiles read as busy/over-repeated (small real-world branding areas like
// Chisel's 5.98in width would show ~6 repeats), so 100% actually renders each tile 1.5x larger than
// that literal baseline. Applies uniformly to both branches so the widthIn-vs-fallback relationship
// (and the slider's own meaning) stays consistent -- only the starting density moved.
const PATTERN_BASE_SCALE = 3;

// A quad's corner order (TL/TR/BR/BL by role) doesn't guarantee quad[0]->quad[1] ("top") is
// actually the region's longer/primary visual dimension -- a rect built from x/y/w/h always has
// it right (top = the literal width), but a hand-placed poly's corners can put the long axis on
// either pair depending on how they were clicked in the masking tool. An elongated diagonal
// sliver (e.g. a pencil facet) can easily have its "top" edge be the short cross-width instead,
// which silently fed the SHORT edge in as "regionWidthPx" and produced way more tile repeats than
// intended. Auto-picking the longer pair keeps widthIn tracking the same real dimension regardless
// of corner order. uIsLongAxis tells callers (the perspective sampler) which homography axis (u,
